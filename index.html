    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="cp-save-btn" onclick="saveEditorPassword()">Guardar</button>
    </div>`;
  document.getElementById("modalBg").hidden = false;
  document.getElementById("cp-current").focus();
}

async function saveEditorPassword() {
  const current = document.getElementById("cp-current").value;
  const newPass = document.getElementById("cp-new").value;
  const confirm = document.getElementById("cp-confirm").value;
  const errEl = document.getElementById("cp-error");

  if (!current || !newPass || !confirm) { errEl.textContent = "Complete todos los campos"; return; }

  const correctPass = await loadEditorPassword();
  if (current !== correctPass) { errEl.textContent = "Contraseña actual incorrecta"; return; }
  if (newPass.length < 4) { errEl.textContent = "La nueva contraseña debe tener al menos 4 caracteres"; return; }
  if (newPass !== confirm) { errEl.textContent = "Las contraseñas no coinciden"; return; }

  if (!firestoreReady || !db) { errEl.textContent = "Sin conexión al servidor"; return; }

  document.getElementById("cp-save-btn").disabled = true;
  document.getElementById("cp-save-btn").textContent = "Guardando...";
  try {
    await db.collection("config").doc("editor").set({
      password: newPass,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    editorPassCache = newPass;
    closeModal();
    toast("Contraseña de editor actualizada");
  } catch(e) {
    console.error("Error saving editor password:", e);
    errEl.textContent = "Error al guardar. Intente de nuevo.";
    document.getElementById("cp-save-btn").disabled = false;
    document.getElementById("cp-save-btn").textContent = "Guardar";
  }
}

async function checkAuth() {
  try {
    const auth = localStorage.getItem("inv_auth");
    if (auth === "editor" || auth === "1") {
      userRole = "editor";
      userName = "Editor";
      try { localStorage.setItem("inv_auth", "editor"); } catch(e) {}
      document.getElementById("loginOverlay").hidden = true;
      document.getElementById("appMain").hidden = false;
      loadSolicitudes();
      return;
    }
    if (auth === "lector") {
      const savedUser = localStorage.getItem("inv_auth_user");
      if (savedUser && firestoreReady) {
        try {
          const snap = await db.collection("usuarios").where("username","==",savedUser).get();
          if (!snap.empty) {
            const data = snap.docs[0].data();
            userRole = "lector";
            userName = data.displayName || savedUser;
            document.getElementById("loginOverlay").hidden = true;
            document.getElementById("appMain").hidden = false;
            loadSolicitudes();
            render();
            return;
          }
        } catch(e) {}
      }
      try { localStorage.removeItem("inv_auth"); localStorage.removeItem("inv_auth_user"); } catch(e) {}
    }
  } catch(e) {}
  document.getElementById("loginOverlay").hidden = false;
  document.getElementById("appMain").hidden = true;
  document.getElementById("loginPass").focus();
}

// ═══════════════════════════════════════
//  USER ACCOUNT MANAGEMENT (editor only)
// ═══════════════════════════════════════
function openUserManager() {
  if (userRole !== "editor") return;
  currentLoc = null; currentDrawer = null;
  viewMode = "users";
  render();
}

async function renderUsersPanel() {
  let html = '<div style="max-width:600px;margin:0 auto;padding:20px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">';
  html += '<h2 style="font-family:var(--sans);font-size:18px;margin:0">Gestión de Usuarios</h2>';
  html += '<button class="btn-add" onclick="openAddUserModal()">+ Nuevo Usuario</button>';
  html += '</div>';

  if (!firestoreReady) {
    html += '<p style="color:var(--text-sec)">Sin conexión a Firestore</p>';
  } else {
    try {
      const snap = await db.collection("usuarios").orderBy("username").get();
      if (snap.empty) {
        html += '<p style="color:var(--text-sec);text-align:center;padding:30px 0">No hay usuarios creados aún</p>';
      } else {
        snap.forEach(doc => {
          const u = doc.data();
          html += `<div class="user-card">
            <div><span class="user-name">${esc(u.displayName||u.username)}</span>
            <span class="user-role" style="margin-left:8px">@${esc(u.username)}</span></div>
            <div style="display:flex;gap:6px">
              <button class="btn-reject" onclick="resetUserPassword('${doc.id}','${esc(u.username)}')" title="Cambiar contraseña" style="padding:4px 10px;font-size:11px">🔑</button>
              <button class="btn-reject" onclick="deleteUser('${doc.id}','${esc(u.username)}')" title="Eliminar" style="padding:4px 10px;font-size:11px;color:var(--red)">✕</button>
            </div>
          </div>`;
        });
      }
    } catch(e) {
      html += '<p style="color:var(--red)">Error cargando usuarios</p>';
    }
  }
  html += '</div>';
  document.getElementById("content").innerHTML = html;
}

function openAddUserModal() {
  document.getElementById("modalBox").innerHTML = `
    <h3 style="font-family:var(--sans);margin-bottom:16px">Crear Usuario Lector</h3>
    <div class="fg"><label>Nombre para mostrar</label><input id="f-newname" placeholder="Ej: Juan Pérez"></div>
    <div class="fg"><label>Nombre de usuario (login)</label><input id="f-newuser" placeholder="Ej: juanperez" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9._-]/g,'')"></div>
    <div class="fg"><label>Contraseña</label><input id="f-newpass" type="password" placeholder="Mínimo 4 caracteres"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveNewUser()">Crear Usuario</button>
    </div>`;
  document.getElementById("modalBg").hidden = false;
}

async function saveNewUser() {
  const displayName = document.getElementById("f-newname").value.trim();
  const username = document.getElementById("f-newuser").value.trim().toLowerCase();
  const password = document.getElementById("f-newpass").value;
  if (!displayName) { toast("Ingrese un nombre"); return; }
  if (!username || username.length < 3) { toast("Usuario debe tener al menos 3 caracteres"); return; }
  if (!password || password.length < 4) { toast("Contraseña debe tener al menos 4 caracteres"); return; }
  if (!firestoreReady) { toast("Sin conexión a Firestore"); return; }

  try {
    const existing = await db.collection("usuarios").where("username","==",username).get();
    if (!existing.empty) { toast("Ese nombre de usuario ya existe"); return; }

    await db.collection("usuarios").add({
      username: username,
      displayName: displayName,
      password: password,
      role: "lector",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast("Usuario '" + displayName + "' creado");
    renderUsersPanel();
  } catch(e) {
    console.error("Error creating user:", e);
    toast("Error al crear usuario");
  }
}

async function deleteUser(docId, username) {
  if (!confirm("¿Eliminar usuario @" + username + "?")) return;
  try {
    await db.collection("usuarios").doc(docId).delete();
    toast("Usuario eliminado");
    renderUsersPanel();
  } catch(e) { toast("Error al eliminar"); }
}

async function resetUserPassword(docId, username) {
  document.getElementById("modalBox").innerHTML = `
    <h3 style="font-family:var(--sans);margin-bottom:16px">Cambiar Contraseña — @${esc(username)}</h3>
    <div class="fg"><label>Nueva contraseña</label><input id="f-resetpass" type="password" placeholder="Mínimo 4 caracteres"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="doResetPassword('${docId}')">Guardar</button>
    </div>`;
  document.getElementById("modalBg").hidden = false;
}

async function doResetPassword(docId) {
  const newPass = document.getElementById("f-resetpass").value;
  if (!newPass || newPass.length < 4) { toast("Mínimo 4 caracteres"); return; }
  try {
    await db.collection("usuarios").doc(docId).update({ password: newPass });
    closeModal();
    toast("Contraseña actualizada");
  } catch(e) { toast("Error al actualizar"); }
}

// ═══════════════════════════════════════
//  LOAN / REQUEST SYSTEM
// ═══════════════════════════════════════
async function loadSolicitudes() {
  if (!firestoreReady) return;
  try {
    const snap = await db.collection("solicitudes").orderBy("createdAt","desc").get();
    solicitudes = [];
    snap.forEach(doc => { solicitudes.push({ id: doc.id, ...doc.data() }); });
  } catch(e) { console.warn("Error loading solicitudes:", e); }
  // Listen for real-time updates
  try {
    db.collection("solicitudes").orderBy("createdAt","desc").onSnapshot(snap => {
      solicitudes = [];
      snap.forEach(doc => { solicitudes.push({ id: doc.id, ...doc.data() }); });
      // Re-render if viewing solicitudes
      if (viewMode === "solicitudes" || viewMode === "mis-solicitudes") renderContent();
      updateSolicitudesBadge();
    });
  } catch(e) {}
}

function updateSolicitudesBadge() {
  const badge = document.getElementById("solBadge");
  if (!badge) return;
  const pending = solicitudes.filter(s => s.status === "pendiente").length;
  badge.textContent = pending || "";
  badge.style.display = pending ? "inline-flex" : "none";
}

function openSolicitudesPanel() {
  currentLoc = null; currentDrawer = null;
  viewMode = userRole === "editor" ? "solicitudes" : "mis-solicitudes";
  render();
}

function renderSolicitudesPanel() {
  const isEditor = userRole === "editor";
  const list = isEditor ? solicitudes : solicitudes.filter(s => s.requestedBy === userName);

  let html = '<div style="max-width:700px;margin:0 auto;padding:20px">';
  html += '<h2 style="font-family:var(--sans);font-size:18px;margin-bottom:20px">' +
    (isEditor ? 'Solicitudes de Préstamo' : 'Mis Solicitudes') + '</h2>';

  // Tabs: Pendientes / Aprobadas / Historial
  const tabs = isEditor
    ? [["pendiente","Pendientes"],["aprobada","Prestados"],["all","Historial"]]
    : [["pendiente","Pendientes"],["aprobada","Prestados"],["all","Todas"]];

  const solFilter = window._solFilter || "pendiente";
  html += '<div class="filter-bar" style="margin-bottom:16px">';
  tabs.forEach(([val,label]) => {
    const count = val === "all" ? list.length : list.filter(s=>s.status===val).length;
    html += `<span class="filter-chip${solFilter===val?' active':''}" onclick="window._solFilter='${val}';renderContent()">${label} (${count})</span>`;
  });
  html += '</div>';

  const filtered = solFilter === "all" ? list : list.filter(s => s.status === solFilter);

  if (filtered.length === 0) {
    html += '<p style="color:var(--text-sec);text-align:center;padding:30px 0">No hay solicitudes</p>';
  } else {
    filtered.forEach(s => {
      const dateStr = s.createdAt ? new Date(s.createdAt.seconds*1000).toLocaleDateString("es-CO") : "—";
      const returnDate = s.returnDate || "—";
      html += `<div class="req-card">
        <div class="req-header">
          <span class="req-user">👤 ${esc(s.requestedBy)}</span>
          <span class="req-status req-st-${s.status}">${s.status.charAt(0).toUpperCase()+s.status.slice(1)}</span>
        </div>
        <div class="req-item">📦 <strong>${esc(s.itemName)}</strong> × ${s.quantity || 1}</div>
        <div class="req-item" style="font-size:12px;color:var(--text-sec)">📍 ${esc(s.location)} → ${esc(s.drawer)}</div>
        <div style="display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-top:4px">
          <span>Solicitado: ${dateStr}</span>
          <span>Devolución: ${esc(returnDate)}</span>
        </div>
        ${s.notes ? '<div style="font-size:12px;color:var(--text-sec);margin-top:4px">💬 '+esc(s.notes)+'</div>' : ''}
        <div class="req-actions">`;

      if (isEditor && s.status === "pendiente") {
        html += `<button class="btn-approve" onclick="updateSolicitud('${s.id}','aprobada')">✓ Aprobar</button>`;
        html += `<button class="btn-reject" onclick="updateSolicitud('${s.id}','rechazada')">✕ Rechazar</button>`;
      }
      if (isEditor && s.status === "aprobada") {
        html += `<button class="btn-return" onclick="updateSolicitud('${s.id}','devuelto')">↩ Marcar Devuelto</button>`;
      }
      html += '</div></div>';
    });
  }
  html += '</div>';
  document.getElementById("content").innerHTML = html;
}

function requestItem(itemId) {
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const today = new Date().toISOString().split("T")[0];
  const nextWeek = new Date(Date.now() + 7*86400000).toISOString().split("T")[0];

  document.getElementById("modalBox").innerHTML = `
    <h3 style="font-family:var(--sans);margin-bottom:16px">Solicitar Préstamo</h3>
    <div style="background:var(--surface-alt);border:1px solid var(--border-light);border-radius:var(--radius);padding:12px;margin-bottom:14px">
      <div style="font-weight:600">${esc(item.name)}</div>
      <div style="font-size:12px;color:var(--text-sec);margin-top:2px">${esc(item.location)} → ${esc(item.drawer)}</div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Cantidad</label><input id="f-reqQty" type="number" min="1" max="${item.quantity}" value="1"></div>
      <div class="fg"><label>Fecha de devolución</label><input id="f-reqReturn" type="date" min="${today}" value="${nextWeek}"></div>
    </div>
    <div class="fg"><label>Nota (opcional)</label><input id="f-reqNotes" placeholder="Motivo o detalle"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="submitRequest('${item.id}')">Enviar Solicitud</button>
    </div>`;
  document.getElementById("modalBg").hidden = false;
}

async function submitRequest(itemId) {
  const item = items.find(i => i.id === itemId);
  if (!item || !firestoreReady) { toast("Error: sin conexión"); return; }
  const qty = parseInt(document.getElementById("f-reqQty").value) || 1;
  const returnDate = document.getElementById("f-reqReturn").value;
  const notes = document.getElementById("f-reqNotes").value.trim();

  if (!returnDate) { toast("Seleccione fecha de devolución"); return; }

  try {
    await db.collection("solicitudes").add({
      itemId: item.id,
      itemName: item.name,
      location: item.location,
      drawer: item.drawer,
      quantity: qty,
      returnDate: returnDate,
      notes: notes,
      requestedBy: userName,
      status: "pendiente",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast("Solicitud enviada");
  } catch(e) {
    console.error("Error submitting request:", e);
    toast("Error al enviar solicitud");
  }
}

async function updateSolicitud(solId, newStatus) {
  if (!firestoreReady) return;
  try {
    const update = { status: newStatus };
    if (newStatus === "aprobada") update.approvedAt = firebase.firestore.FieldValue.serverTimestamp();
    if (newStatus === "devuelto") update.returnedAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("solicitudes").doc(solId).update(update);
    toast(newStatus === "aprobada" ? "Préstamo aprobado" : newStatus === "rechazada" ? "Solicitud rechazada" : "Devolución registrada");
  } catch(e) { toast("Error al actualizar"); }
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadData();
checkAuth().then(() => { render(); });
</script>
