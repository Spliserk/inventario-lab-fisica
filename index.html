<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Lab Física — UNISANGIL</title>
<meta name="description" content="Sistema de inventario del Laboratorio de Física - UNISANGIL / ABC Laboratorios S.A.S.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<script>
try {
  const savedTheme = localStorage.getItem("inv_theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
} catch(e) {}
</script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
<style>
:root {
  --bg: #F1F3F4;
  --surface: #FFFFFF;
  --surface-alt: #F8F9FA;
  --surface-raised: #FFFFFF;
  --text: #202124;
  --text-sec: #5F6368;
  --text-dim: #9AA0A6;
  --border: #DADCE0;
  --border-light: #E8EAED;
  --accent: #1A73E8;
  --accent-hover: #1557B0;
  --accent-soft: #E8F0FE;
  --accent-light: #D2E3FC;
  --green: #1E8E3E;
  --green-bg: #E6F4EA;
  --green-bdr: #A8DAB5;
  --amber: #E37400;
  --amber-bg: #FEF7E0;
  --amber-bdr: #FDD663;
  --red: #D93025;
  --red-bg: #FCE8E6;
  --red-bdr: #F28B82;
  --purple: #7B1FA2;
  --purple-bg: #F3E8FD;
  --danger: #D93025;
  --shadow-1: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2: 0 1px 2px 0 rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  --shadow-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  --shadow-s: var(--shadow-1);
  --shadow-m: var(--shadow-2);
  --radius: 8px;
  --radius-lg: 16px;
  --radius-xl: 28px;
  --sans: 'Google Sans', 'Roboto', 'Segoe UI', system-ui, sans-serif;
  --body: 'Roboto', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Roboto Mono', 'Consolas', monospace;
  --topbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1F1F;
    --surface: #2D2D2D;
    --surface-alt: #353535;
    --surface-raised: #3C3C3C;
    --text: #E3E3E3;
    --text-sec: #ABABAB;
    --text-dim: #757575;
    --border: #444444;
    --border-light: #3A3A3A;
    --accent: #8AB4F8;
    --accent-hover: #AECBFA;
    --accent-soft: #1A3356;
    --accent-light: #1D3B5E;
    --green: #81C995;
    --green-bg: #1B3626;
    --green-bdr: #2D6A3E;
    --amber: #FDD663;
    --amber-bg: #3A3018;
    --amber-bdr: #5C4C1D;
    --red: #F28B82;
    --red-bg: #3C2020;
    --red-bdr: #6E2D2D;
    --purple: #D7AEFB;
    --purple-bg: #2D1B42;
    --danger: #F28B82;
    --shadow-1: 0 1px 3px rgba(0,0,0,.5);
    --shadow-2: 0 2px 6px rgba(0,0,0,.5);
    --shadow-3: 0 4px 12px rgba(0,0,0,.5);
    --shadow-s: var(--shadow-1);
    --shadow-m: var(--shadow-2);
  }
}
:root[data-theme="dark"] {
    --bg: #1F1F1F;
    --surface: #2D2D2D;
    --surface-alt: #353535;
    --surface-raised: #3C3C3C;
    --text: #E3E3E3;
    --text-sec: #ABABAB;
    --text-dim: #757575;
    --border: #444444;
    --border-light: #3A3A3A;
    --accent: #8AB4F8;
    --accent-hover: #AECBFA;
    --accent-soft: #1A3356;
    --accent-light: #1D3B5E;
    --green: #81C995;
    --green-bg: #1B3626;
    --green-bdr: #2D6A3E;
    --amber: #FDD663;
    --amber-bg: #3A3018;
    --amber-bdr: #5C4C1D;
    --red: #F28B82;
    --red-bg: #3C2020;
    --red-bdr: #6E2D2D;
    --purple: #D7AEFB;
    --purple-bg: #2D1B42;
    --danger: #F28B82;
    --shadow-1: 0 1px 3px rgba(0,0,0,.5);
    --shadow-2: 0 2px 6px rgba(0,0,0,.5);
    --shadow-3: 0 4px 12px rgba(0,0,0,.5);
    --shadow-s: var(--shadow-1);
    --shadow-m: var(--shadow-2);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }

/* ── Material Ripple ── */
.ripple { position: relative; overflow: hidden; }
.ripple::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--ripple-x,50%) var(--ripple-y,50%), rgba(0,0,0,.08) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 300ms ease;
  pointer-events: none;
}
.ripple:active::after { opacity: 1; transition: opacity 0ms; }

/* ── Material Icon helper ── */
.mi { font-family: 'Material Symbols Rounded'; font-size: 22px; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }

/* ── APP SHELL ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR (Material Navigation Drawer) ── */
.sidebar {
  width: 290px;
  min-width: 290px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-1);
  z-index: 10;
}
.sidebar-brand {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border-light);
}
.sidebar-brand h1 {
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1.3;
}
.sidebar-brand p {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  letter-spacing: 0.01em;
}

/* Section tabs */
.section-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-light);
  padding: 0 8px;
}
.section-tab {
  flex: 1;
  padding: 14px 12px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 200ms ease;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.section-tab:hover { color: var(--text-sec); background: var(--surface-alt); }
.section-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: transparent;
}

.sidebar-search {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light);
}
.sidebar-search input {
  width: 100%;
  padding: 10px 14px 10px 40px;
  border: none;
  border-radius: var(--radius-xl);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: box-shadow 200ms ease, background 200ms ease;
  min-height: 44px;
}
.sidebar-search input:focus { background: var(--surface); box-shadow: var(--shadow-1); }
.sidebar-search input::placeholder { color: var(--text-dim); }
.search-wrap { position: relative; }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 18px;
  pointer-events: none;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.nav-group { padding: 0 12px; margin-bottom: 2px; }
.nav-group-label {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding: 12px 14px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  border-radius: var(--radius-xl);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-sec);
  transition: all 150ms ease;
  user-select: none;
  min-height: 48px;
  font-weight: 500;
  position: relative;
  overflow: hidden;
}
.nav-item:hover { background: var(--surface-alt); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-expand-icon { margin-left: auto; font-size: 18px; color: var(--text-dim); }
.nav-expand-icon + .nav-badge { margin-left: 0; }
.nav-badge {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  background: var(--surface-alt);
  padding: 2px 10px;
  border-radius: 12px;
  font-variant-numeric: tabular-nums;
}
.nav-code {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}
.nav-item.active .nav-badge { background: var(--accent); color: #fff; }
.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nav-sub { padding-left: 24px; }
.nav-sub .nav-item { font-size: 13px; min-height: 42px; }

.sidebar-footer {
  padding: 0;
  border-top: 1px solid var(--border-light);
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-footer .footer-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
}
.sidebar-footer .footer-count {
  font-size: 12px;
  color: var(--text-dim);
  flex: 1;
}
.sidebar-footer .footer-menu-toggle {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-xl);
  transition: all .2s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
}
.sidebar-footer .footer-menu-toggle:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sidebar-footer .footer-menu-toggle.open { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sidebar-footer .footer-menu-toggle .mi { font-size: 18px; transition: transform 250ms ease; }
.sidebar-footer .footer-menu-toggle.open .mi { transform: rotate(180deg); }
.sidebar-footer button.logout-btn {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-xl);
  transition: all .2s ease;
  white-space: nowrap;
  min-height: 36px;
}
.sidebar-footer button.logout-btn:hover { background: var(--danger); color: #fff; }

/* Collapsible footer menu — opens upward */
.footer-drawer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 300ms cubic-bezier(.4,0,.2,1), opacity 200ms ease;
  opacity: 0;
  border-bottom: none;
}
.footer-drawer.open {
  max-height: 50vh;
  overflow-y: auto;
  opacity: 1;
  border-bottom: 1px solid var(--border-light);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.footer-drawer-inner {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 14px 6px;
}
.footer-drawer-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-sec);
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  transition: all 150ms ease;
  min-height: 42px;
  font-family: var(--body);
}
.footer-drawer-item:hover { background: var(--surface-alt); color: var(--text); }
.footer-drawer-item .mi { font-size: 18px; }
.footer-drawer-sep {
  border-top: 1px solid var(--border-light);
  margin: 4px 8px;
}

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── TOPBAR (Material App Bar) ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 24px;
  background: var(--surface);
  flex-wrap: wrap;
  min-height: var(--topbar-h);
  box-shadow: var(--shadow-1);
  z-index: 5;
  position: relative;
}
.topbar-title {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-right: auto;
}
.topbar-crumb {
  font-size: 13px;
  color: var(--text-dim);
  margin-left: 8px;
  font-weight: 400;
}
.stat-pills { display: flex; gap: 10px; margin-right: 8px; }
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--radius-xl);
  font-variant-numeric: tabular-nums;
  min-height: 32px;
}
.pill-ok { background: var(--green-bg); color: var(--green); }
.pill-warn { background: var(--amber-bg); color: var(--amber); }
.pill-bad { background: var(--red-bg); color: var(--red); }
.pill-note { background: var(--purple-bg); color: var(--purple); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 200ms ease;
  white-space: nowrap;
  min-height: 40px;
  position: relative;
  overflow: hidden;
}
.btn:hover { background: var(--surface-alt); box-shadow: var(--shadow-1); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-1); }
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: var(--shadow-2); }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: var(--red-bg); border-color: var(--red); }
.btn-sm { padding: 8px 16px; font-size: 13px; min-height: 36px; }
.btn-mobile-menu { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 8px; min-width: 48px; min-height: 48px; border-radius: 50%; }
.btn-mobile-menu:hover { background: var(--surface-alt); }

/* ── FAB (Floating Action Button) ── */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  box-shadow: var(--shadow-3);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  transition: all 200ms ease;
  z-index: 50;
}
.fab:hover { box-shadow: 0 6px 16px rgba(26,115,232,.4); transform: scale(1.05); }

/* ── CONTENT ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* ── DASHBOARD ── */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.dash-card {
  background: var(--surface);
  border: none;
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: var(--shadow-1);
  transition: box-shadow 200ms ease;
}
.dash-card:hover { box-shadow: var(--shadow-2); }
.dash-card-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.dash-card-value {
  font-family: var(--sans);
  font-size: 36px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.dash-card-value.ok { color: var(--green); }
.dash-card-value.warn { color: var(--amber); }
.dash-card-value.bad { color: var(--red); }
.dash-card-sub {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 6px;
}

.dash-section-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text-sec);
}

.dash-locations {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.dash-loc {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--surface);
  border: none;
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--shadow-1);
}
.dash-loc:hover { box-shadow: var(--shadow-2); background: var(--accent-soft); }
.dash-loc-icon { font-size: 28px; flex-shrink: 0; }
.dash-loc-info { min-width: 0; flex: 1; }
.dash-loc-name {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dash-loc-count { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.dash-loc-bar {
  height: 6px;
  background: var(--border-light);
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
  display: flex;
}
.dash-loc-bar span { height: 100%; }
.bar-ok { background: var(--green); }
.bar-warn { background: var(--amber); }
.bar-bad { background: var(--red); }

/* ── TABLE ── */
.filter-bar { display: flex; gap: 8px; padding-bottom: 16px; flex-wrap: wrap; }
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sec);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 200ms ease;
  min-height: 36px;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.tbl-wrap {
  background: var(--surface);
  border: none;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-1);
}
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead { position: sticky; top: 0; z-index: 2; }
th {
  background: var(--surface-alt);
  padding: 14px 16px;
  text-align: left;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-sec);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-alt); }

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: var(--radius-xl);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  min-height: 28px;
  transition: opacity 150ms;
}
.status-tag:hover { opacity: .85; }
.st-presente { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bdr); }
.st-desgastado { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bdr); }
.st-posible-faltante, .st-faltante, .st-dañado { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bdr); }
.st-nota { background: var(--purple-bg); color: var(--purple); border: 1px solid transparent; }
.st-fuera { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bdr); }
.st-prestado { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-light); }

.editable {
  cursor: pointer;
  border-radius: var(--radius);
  padding: 4px 6px;
  margin: -4px -6px;
  transition: background 150ms;
}
.editable:hover { background: var(--accent-soft); }
.qty { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }

.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 150ms; }
tr:hover .row-actions { opacity: 1; }
.row-act {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 50%;
  font-size: 16px;
  transition: all 150ms;
}
.row-act:hover { background: var(--surface-alt); color: var(--text); }
.row-act.del:hover { background: var(--red-bg); color: var(--red); }

/* ── EMPTY STATE ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  color: var(--text-dim);
  text-align: center;
}
.empty h3 {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-sec);
  margin: 16px 0 8px;
}
.empty p { font-size: 15px; max-width: 340px; line-height: 1.5; }

/* ── MODAL (Material Dialog) ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 150ms ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-bg[hidden] { display: none !important; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-3);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalSlide 200ms ease;
}
@keyframes modalSlide { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
}
.modal-head h2 { font-family: var(--sans); font-size: 18px; font-weight: 700; }
.modal-x {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  color: var(--text-dim); cursor: pointer;
  border-radius: 50%; font-size: 22px;
  transition: background 150ms;
}
.modal-x:hover { background: var(--surface-alt); color: var(--text); }
.modal-body { padding: 24px; }
.fg { margin-bottom: 18px; }
.fg label {
  display: block;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sec);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 200ms, box-shadow 200ms;
  min-height: 48px;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fg textarea { resize: vertical; min-height: 80px; }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border-light);
}

/* ── TOAST (Material Snackbar) ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #323232;
  color: #fff;
  padding: 14px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-3);
  z-index: 200;
  opacity: 0;
  transition: all 300ms cubic-bezier(.4,0,.2,1);
  max-width: 500px;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .sidebar { position: fixed; left: -300px; top: 0; bottom: 0; z-index: 90; transition: left 250ms cubic-bezier(.4,0,.2,1); width: 290px; box-shadow: none; }
  .sidebar.open { left: 0; box-shadow: var(--shadow-3); }
  .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 89; transition: opacity 250ms ease; }
  .mobile-overlay[hidden] { display: none !important; }
  .btn-mobile-menu { display: flex; align-items: center; justify-content: center; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .stat-pills { display: none; }
  .fg-row { grid-template-columns: 1fr; }
  .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .fab { display: flex; }
}
@media (max-width: 480px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .content { padding: 12px; }
  .dash-locations { grid-template-columns: 1fr; }
}

/* ── LOGIN OVERLAY (Material Card) ── */
.login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-overlay[hidden] { display: none !important; }
.login-box {
  background: var(--surface);
  border: none;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-3);
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.login-box h2 {
  font-family: var(--sans);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}
.login-box .login-sub {
  font-size: 14px;
  color: var(--text-sec);
  margin-bottom: 28px;
}
.login-box .login-icon {
  font-size: 56px;
  margin-bottom: 16px;
}
.login-box input {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 16px;
  text-align: center;
  outline: none;
  margin-bottom: 16px;
  letter-spacing: 2px;
  transition: border-color 200ms, box-shadow 200ms;
  min-height: 52px;
}
.login-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.login-box .login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-xl);
  background: var(--accent);
  color: #fff;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 200ms;
  min-height: 52px;
  box-shadow: var(--shadow-1);
}
.login-box .login-btn:hover { background: var(--accent-hover); box-shadow: var(--shadow-2); }
.login-box .login-error {
  color: var(--red);
  font-size: 13px;
  margin-top: 12px;
  min-height: 20px;
}
.login-box .login-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 20px;
}
.login-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  overflow: hidden;
}
.login-tab {
  flex: 1;
  padding: 12px 12px;
  border: none;
  background: var(--surface-alt);
  color: var(--text-sec);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 200ms;
  min-height: 48px;
}
.login-tab.active {
  background: var(--accent);
  color: #fff;
}
.login-tab:not(.active):hover { background: var(--border-light); }
.login-fields { display: flex; flex-direction: column; gap: 0; }
.login-fields input { letter-spacing: normal; text-align: left; }
.login-fields input[type="password"] { letter-spacing: 2px; }

/* ── LOAN REQUEST BADGE ── */
.loan-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 50%; min-width: 22px; height: 22px; padding: 0 6px;
  margin-left: 8px;
}
.req-card {
  background: var(--surface); border: none; border-radius: var(--radius-lg);
  padding: 20px 24px; margin-bottom: 14px; box-shadow: var(--shadow-1);
  transition: box-shadow 200ms;
}
.req-card:hover { box-shadow: var(--shadow-2); }
.req-card .req-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.req-card .req-user { font-weight: 600; font-family: var(--sans); font-size: 15px; }
.req-card .req-date { font-size: 12px; color: var(--text-dim); }
.req-card .req-item { font-size: 14px; margin-bottom: 6px; }
.req-card .req-actions { display: flex; gap: 10px; margin-top: 14px; }
.req-card .req-actions button {
  padding: 10px 20px; border: none; border-radius: var(--radius-xl);
  font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
  min-height: 40px; transition: all 200ms;
}
.btn-approve { background: var(--green); color: #fff; box-shadow: var(--shadow-1); }
.btn-approve:hover { opacity: 0.9; box-shadow: var(--shadow-2); }
.btn-reject { background: var(--surface-alt); color: var(--text-sec); border: 1px solid var(--border) !important; }
.btn-reject:hover { background: var(--border-light); }
.btn-return { background: var(--amber); color: #fff; box-shadow: var(--shadow-1); }
.btn-return:hover { opacity: 0.9; }
.req-status { display: inline-block; padding: 4px 12px; border-radius: var(--radius-xl); font-size: 12px; font-weight: 600; }
.req-st-pendiente { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bdr); }
.req-st-aprobada { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bdr); }
.req-st-rechazada { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bdr); }
.req-st-devuelto { background: var(--purple-bg); color: var(--purple); border: 1px solid #c4b5e0; }
.user-card {
  background: var(--surface); border: none; border-radius: var(--radius-lg);
  padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  box-shadow: var(--shadow-1); transition: box-shadow 200ms;
}
.user-card:hover { box-shadow: var(--shadow-2); }
.user-card .user-name { font-weight: 600; font-family: var(--sans); font-size: 15px; }
.user-card .user-role { font-size: 12px; color: var(--text-dim); }
.users-panel { width: 100%; max-width: 820px; margin: 0 auto; padding: 24px 8px; }
.users-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.users-heading h2 { font-family: var(--sans); font-size: 20px; font-weight: 600; }
.users-heading p { color: var(--text-sec); font-size: 14px; margin-top: 3px; }
.users-search { position: relative; margin: 0 0 16px; }
.users-search .mi { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 20px; pointer-events: none; }
.users-search input { width: 100%; min-height: 44px; padding: 10px 14px 10px 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); outline: none; transition: border-color 150ms, box-shadow 150ms; }
.users-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.users-search input::placeholder { color: var(--text-dim); }
.users-list { display: grid; gap: 10px; }
.user-card { gap: 20px; margin: 0; min-width: 0; }
.user-card[hidden] { display: none; }
.user-info { min-width: 0; }
.user-meta { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-top: 4px; }
.user-username { font-size: 12px; color: var(--text-sec); }
.user-role { padding: 2px 9px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }
.user-email, .user-missing-email { font-size: 13px; color: var(--text-sec); overflow-wrap: anywhere; }
.user-missing-email { color: var(--amber); }
.user-actions { display: flex; flex-shrink: 0; }
.user-action {
  width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--text-sec); cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
}
.user-action:hover { background: var(--accent-soft); color: var(--accent); }
.user-menu { position: relative; z-index: 1; }
.user-menu[open] { z-index: 30; }
.user-menu summary { list-style: none; }
.user-menu summary::-webkit-details-marker { display: none; }
.user-menu[open] > summary { background: var(--accent-soft); color: var(--accent); }
.user-menu-popover { position: absolute; top: calc(100% + 4px); right: 0; z-index: 31; min-width: 190px; padding: 6px; background: var(--surface); border: 1px solid var(--border-light); border-radius: 12px; box-shadow: var(--shadow-3); }
.user-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); text-align: left; font-size: 13px; cursor: pointer; }
.user-menu-item:hover { background: var(--surface-alt); }
.user-menu-item .mi { font-size: 18px; color: var(--text-sec); }
.user-menu-item.danger, .user-menu-item.danger .mi { color: var(--red); }
.user-menu-item.danger:hover { background: var(--red-bg); }
.users-empty { background: var(--surface); border-radius: var(--radius-lg); padding: 40px 24px; text-align: center; color: var(--text-sec); box-shadow: var(--shadow-1); }
@media (max-width: 560px) {
  .users-panel { padding: 16px 0; }
  .users-heading { align-items: flex-start; flex-direction: column; }
  .user-card { align-items: flex-start; padding: 16px; gap: 10px; }
  .user-actions { margin-left: auto; }
}
.btn-request-item {
  padding: 10px 20px; border: 1px solid var(--accent); border-radius: var(--radius-xl);
  background: var(--accent-soft); color: var(--accent); font-family: var(--sans);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 200ms;
  min-height: 40px;
}
.btn-request-item:hover { background: var(--accent); color: #fff; box-shadow: var(--shadow-1); }
.logout-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--radius);
}
.logout-btn:hover { color: var(--red); background: var(--red-bg); }

/* ── STATUS DROPDOWN ── */
.status-dropdown {
  position: absolute;
  z-index: 50;
  background: var(--surface);
  border: none;
  border-radius: var(--radius);
  box-shadow: var(--shadow-3);
  padding: 8px 0;
  min-width: 200px;
  animation: sdFadeIn 150ms ease;
}
@keyframes sdFadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.status-dropdown-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 100ms ease;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  color: var(--text);
  font-family: var(--body);
  min-height: 48px;
}
.status-dropdown-item:hover { background: var(--surface-alt); }
.status-dropdown-item.selected { background: var(--accent-soft); font-weight: 600; }
.status-dropdown-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dropdown-overlay {
  position: fixed;
  inset: 0;
  z-index: 49;
}

/* ── LOCATION MANAGEMENT ── */
.loc-mgmt-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  margin: 6px 12px 8px;
  border-radius: var(--radius-xl);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px dashed var(--accent);
  transition: all 200ms ease;
  font-family: var(--sans);
  min-height: 44px;
}
.loc-mgmt-btn:hover { background: var(--accent); color: #fff; border-style: solid; }
.loc-actions {
  display: flex;
  gap: 4px;
  margin-left: auto;
  opacity: 0;
  transition: opacity 150ms;
}
.nav-item:hover .loc-actions,
.dash-loc:hover .loc-actions { opacity: 1; }
.loc-act-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 4px 6px;
  border-radius: 50%;
  color: var(--text-dim);
  transition: all 150ms;
  line-height: 1;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.loc-act-btn:hover { background: var(--surface-alt); color: var(--text); }
.loc-act-btn.del:hover { background: var(--red-bg); color: var(--red); }
.drawer-list-editor { display: flex; flex-direction: column; gap: 8px; }
.drawer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.drawer-row input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 14px;
  min-height: 44px;
}
.drawer-row button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 20px;
  color: var(--red);
  padding: 6px 8px;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.drawer-row button:hover { background: var(--red-bg); }
.add-drawer-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  margin-top: 6px;
  background: none;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  font-family: var(--body);
  min-height: 44px;
}
.add-drawer-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.icon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.icon-opt {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 150ms;
  background: var(--surface);
}
.icon-opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.icon-opt.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }

/* ═══ INLINE EDIT ═══ */
.inline-edit-wrap{display:inline-flex;align-items:center;gap:6px;width:100%}
.inline-edit-input{font:inherit;font-size:14px;padding:8px 12px;border:2px solid var(--accent);border-radius:var(--radius);background:var(--surface);color:var(--text);width:100%;outline:none;min-height:40px}
.inline-edit-input:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.inline-edit-actions{display:flex;gap:4px}
.inline-edit-actions button{background:none;border:none;cursor:pointer;padding:6px 8px;font-size:18px;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.inline-edit-actions button:hover{background:var(--surface-alt)}

/* ═══ BULK OPERATIONS ═══ */
.bulk-bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-lg);margin-bottom:14px;font-size:14px;font-weight:500;animation:slideDown .25s ease;min-height:48px;box-shadow:var(--shadow-2);position:sticky;top:0;z-index:4}
.bulk-bar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-xl);cursor:pointer;font-size:13px;font-weight:500;min-height:36px}
.bulk-bar button:hover{background:rgba(255,255,255,.35)}
.bulk-bar .bulk-close{background:none;font-size:20px;padding:4px 8px;margin-left:auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chk-cell{width:40px;text-align:center}
.chk-cell input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--accent)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* ═══ SYNC INDICATOR ═══ */
.sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-online .sync-dot{background:#1E8E3E}
.sync-offline .sync-dot{background:#D93025;animation:pulse-dot 1.5s infinite}
.sync-syncing .sync-dot{background:#E37400;animation:pulse-dot .8s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
#syncIndicator{font-size:12px;color:var(--text-dim);display:inline-flex;align-items:center;padding:6px 14px;gap:6px;cursor:default;border-radius:var(--radius-xl);background:var(--surface-alt);border:none;margin-left:auto;min-height:32px}
.sync-online #syncText{color:var(--green)}
.sync-offline #syncText{color:var(--danger)}
.sync-syncing #syncText{color:var(--amber)}

/* ═══ AUDIT LOG ═══ */
.log-entry{padding:14px 20px;border-bottom:1px solid var(--border-light);font-size:13px;display:flex;flex-direction:column;gap:4px}
.log-entry:last-child{border-bottom:none}
.log-time{color:var(--text-dim);font-family:var(--mono);font-size:12px}
.log-action{font-weight:600}
.log-detail{color:var(--text-sec)}

/* ═══ IMPORT ═══ */
.import-drop{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-sec);cursor:pointer;transition:all .2s;font-size:15px}
.import-drop:hover,.import-drop.dragover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ═══ COLLAPSIBLE MODULE SECTIONS ═══ */
.module-section { margin-bottom: 20px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-1); background: var(--surface); }
.module-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  background: var(--surface);
  border-bottom: 1px solid transparent;
  transition: all 200ms ease;
  min-height: 56px;
}
.module-header:hover { background: var(--surface-alt); }
.module-header.expanded { border-bottom-color: var(--border-light); }
.module-header .module-icon {
  font-size: 24px;
  transition: transform 300ms cubic-bezier(.4,0,.2,1);
  color: var(--text-sec);
}
.module-header.expanded .module-icon { transform: rotate(180deg); color: var(--accent); }
.module-header .module-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  flex: 1;
}
.module-header .module-count {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  background: var(--surface-alt);
  padding: 4px 12px;
  border-radius: 12px;
}
.module-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 350ms cubic-bezier(.4,0,.2,1);
}
.module-body.open {
  max-height: 5000px;
}

/* ═══ PRINT ═══ */
@media print{
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .sidebar,.topbar,.login-overlay,#modalBg,#toast,.mobile-toggle,.row-actions,.btn-request-item,.filter-bar,.bulk-bar,.chk-cell,.fab{display:none!important}
  .main{margin-left:0!important;padding:10px!important}

  .dashboard-grid{grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
  .dash-card{border:1px solid #ccc!important;background:#fff!important;padding:8px!important;break-inside:avoid;box-shadow:none!important}
  .dash-card-value{font-size:18pt!important}
  .dash-card-value.ok{color:#16a34a!important}

  table{width:100%!important;border-collapse:collapse!important;font-size:10pt!important}
  th,td{border:1px solid #ccc!important;padding:4px 6px!important;background:#fff!important;color:#000!important}
  th{background:#f3f4f6!important;font-weight:600!important}
  .status-tag{border:1px solid #999!important;padding:1px 6px!important;font-size:9pt!important;background:transparent!important;color:#000!important}
  .tbl-wrap,.tbl-scroll{overflow:visible!important;box-shadow:none!important}
  a{color:#000!important;text-decoration:none!important}

function storageSet(key, val) {

        i.section = "equipos";
      } else {
        i.section = "materiales";

    loadDefaultEquipos();
    storageSet("inv_dataVersion", 14);

  items = items.filter(i => !(i.section === "equipos" && kits.includes(i.location) && i.drawer === "Mesa de Fuerzas"));

  nextId = Math.max(0, ...items.map(i => parseInt(i.id)||0)) + 1;
  // Generate correct Mesa de Fuerzas items per ABC manual
  kits.forEach(kit => {

    items.push(...mfItems);
  });
  console.log("Migration v11: Mesa de Fuerzas items replaced with ABC manual data (" + kits.length + " kits × 15 items)");

function loadData() {
  // Step 1: Load from localStorage immediately (fast, offline-ready)
  const saved = storageGet("inv_items");
  applyLocalData(saved);
  const savedCodes = storageGet("inv_locCodes");
  if (savedCodes) locCodes = savedCodes;
  const savedMatLocs = storageGet("inv_customMatLocs");
  if (savedMatLocs) customMaterialesLocs = savedMatLocs;
  const savedEqLocs = storageGet("inv_customEqLocs");
  if (savedEqLocs) customEquiposLocs = savedEqLocs;
  const savedDrNotes = storageGet("inv_drawerNotes");
  if (savedDrNotes) drawerNotes = savedDrNotes;
  // Step 2: If Firestore is available, fetch latest data and set up real-time listener
  if (firestoreReady && db) {
    showSyncStatus("☁️ Conectando...", "warn");
    // Initial fetch
    db.collection("inventario").doc("data").get().then(doc => {
      if (doc.exists) {
        const d = doc.data();
        items = d.items || [];
        nextId = d.nextId || (Math.max(...items.map(i => parseInt(i.id)||0)) + 1);
        locCodes = d.locCodes || {};
        customMaterialesLocs = d.customMaterialesLocs || [];
        customEquiposLocs = d.customEquiposLocs || [];
        drawerNotes = d.drawerNotes || {};
        // Migration v11: fix Mesa de Fuerzas in Firestore data too
        const fsVer = d.dataVersion || 0;
        if (fsVer < 11) {
          migrateMesaFuerzas();
        }
        // Migration v12: fix Calorimetría in Firestore data too (2 bandejas)
        if (fsVer < 13) {
          migrateCalorimetria();
        }
        // Migration v14: fix Mecánica in Firestore data too
        if (fsVer < 14) {
          migrateMecanica();
          saveData(); // Push corrected data back to Firestore
          db.collection("inventario").doc("data").update({ dataVersion: 14 }).catch(()=>{});
          storageSet("inv_dataVersion", 14);
        }
        // Update localStorage cache
        storageSet("inv_items", items);
        storageSet("inv_nextId", nextId);
        storageSet("inv_locCodes", locCodes);
        storageSet("inv_customMatLocs", customMaterialesLocs);
        storageSet("inv_customEqLocs", customEquiposLocs);
        storageSet("inv_drawerNotes", drawerNotes);
        render();
        showSyncStatus("☁️ Sincronizado", "ok");
      } else {
        // No data in Firestore yet, push local data up
        saveData();
        showSyncStatus("☁️ Datos subidos", "ok");
      }
    }).catch(err => {
      console.warn("Firestore initial load error:", err);
      showSyncStatus("⚠️ Modo offline", "err");
    });

    // Real-time listener for changes from other devices
    setupRealtimeSync();
  }

  // Save to localStorage (for first-time defaults)
  storageSet("inv_items", items);
  storageSet("inv_nextId", nextId);
}

function initConnectionMonitor() {
  // Detect network changes instantly via browser events
  window.addEventListener("online", () => {
    if (firestoreReady && db) {
      updateSyncIndicator("syncing", "Reconectando...");
      // Verify Firestore is reachable
      db.collection("_connectivity").doc("ping")
        .set({ t: Date.now() }, { merge: true })
        .then(() => updateSyncIndicator("online", "Conectado"))
        .catch(() => updateSyncIndicator("offline", "Sin conexión"));
    } else {
      updateSyncIndicator("online", "Local");
    }
  });
  window.addEventListener("offline", () => {
    updateSyncIndicator("offline", "Sin conexión");
  });
  // Set initial state based on browser
  if (!navigator.onLine) {
    updateSyncIndicator("offline", "Sin conexión");
  }
  // Periodic Firestore ping as fallback
  if (!firestoreReady || !db) return;
  const connRef = db.collection("_connectivity").doc("ping");
  setInterval(async () => {
    try {
      await connRef.set({ t: Date.now() }, { merge: true });
      if (syncState !== "online") updateSyncIndicator("online", "Conectado");
    } catch(e) {
      updateSyncIndicator("offline", "Sin conexión");
    }
  }, 30000);
}

function setupRealtimeSync() {
  if (!firestoreReady || !db) return;
  if (firestoreUnsubscribe) firestoreUnsubscribe(); // cleanup previous

  firestoreUnsubscribe = db.collection("inventario").doc("data").onSnapshot(doc => {
    if (!doc.exists) return;
    // Skip if we just saved (avoid re-render loop)
    if (ignoreNextSnapshot) {
      ignoreNextSnapshot = false;
      return;
    }
    const d = doc.data();
    if (!d.items) return;

    items = d.items;
    nextId = d.nextId || nextId;
    locCodes = d.locCodes || {};
    customMaterialesLocs = d.customMaterialesLocs || [];
    customEquiposLocs = d.customEquiposLocs || [];
    drawerNotes = d.drawerNotes || {};
    // Update localStorage cache
    storageSet("inv_items", items);
    storageSet("inv_nextId", nextId);
    storageSet("inv_locCodes", locCodes);
    storageSet("inv_customMatLocs", customMaterialesLocs);
    storageSet("inv_customEqLocs", customEquiposLocs);
    storageSet("inv_drawerNotes", drawerNotes);
    render();
    showSyncStatus("🔄 Actualizado", "ok");
  }, err => {
    console.warn("Firestore listener error:", err);
  });
}

async function hashPassword(pass) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pass + "_inventario_salt_2024");
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateAuthToken(role, username) {
  const payload = JSON.stringify({ role, username, ts: Date.now(), r: Math.random().toString(36).slice(2) });
  return btoa(payload);
}

function parseAuthToken(token) {
  try {
    const decoded = JSON.parse(atob(token));
    if (Date.now() - decoded.ts > 7 * 24 * 60 * 60 * 1000) return null;
    return decoded;
  } catch(e) { return null; }
}

async function migratePasswords() {
  if (!firestoreReady || !db) return;
  try {
    const configDoc = await db.collection("config").doc("editor").get();
    if (configDoc.exists) {
      const pass = configDoc.data().password;
      if (pass && pass.length !== 64) {
        const hashed = await hashPassword(pass);
        await db.collection("config").doc("editor").update({ password: hashed, migrated: true });
        editorPassCache = hashed;
        console.log("Editor password migrated to hash");
      }
    }
    const usersSnap = await db.collection("usuarios").get();
    for (const doc of usersSnap.docs) {
      const data = doc.data();
      if (data.password && data.password.length !== 64) {
        const hashed = await hashPassword(data.password);
        await db.collection("usuarios").doc(doc.id).update({ password: hashed });
        console.log("Migrated password for user:", data.username);
      }
    }
  } catch(e) { console.warn("Password migration error:", e); }
}

let selectedItems = new Set();

function toggleSelectItem(id) {
  if (selectedItems.has(id)) selectedItems.delete(id);
  else selectedItems.add(id);
  renderBulkBar();
  const cb = document.querySelector('input[data-item-id="' + id + '"]');
  if (cb) cb.checked = selectedItems.has(id);
}

function toggleSelectAll() {
  const display = getCurrentDisplay();
  if (selectedItems.size === display.length) {
    selectedItems.clear();
  } else {
    display.forEach(function(i) { selectedItems.add(i.id); });
  }
  renderContent();
}

function clearSelection() { selectedItems.clear(); renderContent(); }

function getCurrentDisplay() {
  var display = currentFilter ? getFiltered().filter(function(i){ return i.status===currentFilter; }) : getFiltered();
  if (currentLocFilter) display = display.filter(function(i){ return i.location===currentLocFilter; });
  if (currentDrawerFilter) display = display.filter(function(i){ return i.drawer===currentDrawerFilter; });
  return display;
}

function renderBulkBar() {
  var bar = document.getElementById("bulkBar");
  if (selectedItems.size === 0) {
    if (bar) bar.remove();
    return;
  }
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "bulkBar";
    bar.className = "bulk-bar";
    var contentEl = document.getElementById("content");
    contentEl.insertBefore(bar, contentEl.firstChild);
  }
  bar.innerHTML = '<span>' + selectedItems.size + ' seleccionados</span>' +
    '<button onclick="bulkChangeStatus(\'Presente\')">✓ Presente</button>' +
    '<button onclick="bulkChangeStatus(\'Desgastado\')">⚠ Desgastado</button>' +
    '<button onclick="bulkChangeStatus(\'Faltante\')">✕ Faltante</button>' +
    '<button onclick="bulkChangeStatus(\'Dañado\')">🔴 Dañado</button>' +
    '<button onclick="bulkDelete()">🗑 Eliminar</button>' +
    '<button class="bulk-close" onclick="clearSelection()" title="Limpiar selección">&times;</button>';
}

function bulkChangeStatus(newStatus) {
  if (selectedItems.size === 0) return;
  showConfirm("¿Cambiar " + selectedItems.size + " ítems a \"" + newStatus + "\"?", function() {
    var count = 0;
    selectedItems.forEach(function(id) {
      var item = items.find(function(i) { return i.id === id; });
      if (item) { item.status = newStatus; count++; }
    });
    logAction("cambio_masivo_estado", count + " ítems → " + newStatus);
    saveData();
    selectedItems.clear();
    render();
    toast(count + " ítems → " + newStatus);
  });
}

function renumberAffectedDrawers(removedItems) {
  const groupKey = item => JSON.stringify([item.section, item.location, item.drawer]);
  const affectedGroups = new Set(removedItems.map(groupKey));
  affectedGroups.forEach(key => {
    items.filter(item => groupKey(item) === key)
      .sort((a, b) => Number(a.num) - Number(b.num))
      .forEach((item, index) => { item.num = index + 1; });
  });
}

function bulkDelete() {
  if (selectedItems.size === 0) return;
  showConfirm("¿Eliminar " + selectedItems.size + " ítems? Esta acción no se puede deshacer.", function() {
    var count = selectedItems.size;
    var removedItems = items.filter(function(i) { return selectedItems.has(i.id); });
    items = items.filter(function(i) { return !selectedItems.has(i.id); });
    renumberAffectedDrawers(removedItems);
    logAction("eliminacion_masiva", count + " ítems eliminados");
    saveData();
    selectedItems.clear();
    render();
    toast(count + " ítems eliminados");
  });
}

function applyPhotoFindings() {
  // Helper: find item by kit, module, and item number, then update status + obs
  function mark(kit, mod, num, status, obs) {
    const it = items.find(i => i.section==="equipos" && i.location===kit && i.drawer===mod && i.num===num);
    if (it) { it.status = status; if (obs) it.observations = obs; }
  }

  const allKits = ["Kit A","Kit B","Kit C","Kit D","Kit E","Kit F"];
  const em = "Electricidad y Magnetismo";
  const ond = "Ondas";
  const mf = "Mesa de Fuerzas";
  const mec = "Mecánica";
  const op = "Óptica";

  // ══ ELECTRICIDAD Y MAGNETISMO — Todos los kits ══
  // Cajones consistentemente semivacíos. Solo visibles: fuente, trípodes, cables, imanes barra.
  allKits.forEach(kit => {
    mark(kit,em,7,"Faltante","No visible en revisión fotográfica");  // Brújula
    mark(kit,em,8,"Faltante","No visible en revisión fotográfica");  // Electroimán
    mark(kit,em,9,"Faltante","No visible en revisión fotográfica");  // Galvanómetro
    mark(kit,em,10,"Faltante","No visible en revisión fotográfica"); // Interruptor
    mark(kit,em,11,"Faltante","No visible en revisión fotográfica"); // Bombillos juego
    mark(kit,em,12,"Faltante","No visible en revisión fotográfica"); // Resistencias
    mark(kit,em,13,"Faltante","No visible en revisión fotográfica"); // Condensadores
    mark(kit,em,14,"Faltante","No visible en revisión fotográfica"); // Imanes herradura
    mark(kit,em,15,"Faltante","No visible en revisión fotográfica"); // Núcleo hierro dulce
    mark(kit,em,16,"Faltante","No visible en revisión fotográfica"); // Barras electrostática
    mark(kit,em,17,"Faltante","No visible en revisión fotográfica"); // Paños frotamiento
  });

  // ══ CUBETA DE ONDAS — Todos los kits ══
  // Consistentemente faltan la mayoría de accesorios
  allKits.forEach(kit => {
    mark(kit,ond,8,"Faltante","No visible en revisión fotográfica");  // Manual
    mark(kit,ond,9,"Faltante","No visible en revisión fotográfica");  // Estuche
    mark(kit,ond,11,"Faltante","No visible en revisión fotográfica"); // Generador ondas
    mark(kit,ond,12,"Faltante","No visible en revisión fotográfica"); // Lámina vidrio
    mark(kit,ond,13,"Faltante","No visible en revisión fotográfica"); // Pantalla reflexión
    mark(kit,ond,14,"Faltante","No visible en revisión fotográfica"); // Peine difracción
    mark(kit,ond,15,"Faltante","No visible en revisión fotográfica"); // Rendija simple/doble
    mark(kit,ond,16,"Faltante","No visible en revisión fotográfica"); // Superficie absorción
    mark(kit,ond,18,"Faltante","No visible en revisión fotográfica"); // Barrera vidrio plana
    mark(kit,ond,19,"Faltante","No visible en revisión fotográfica"); // Varilla agitación
    mark(kit,ond,20,"Faltante","No visible en revisión fotográfica"); // Nivel burbuja
    mark(kit,ond,21,"Faltante","No visible en revisión fotográfica"); // Bombilla estroboscopio
    mark(kit,ond,22,"Faltante","No visible en revisión fotográfica"); // Espejo plano
  });
  // Fuente vibradora: faltante en F, A, C
  ["Kit F","Kit A","Kit C"].forEach(kit => {
    mark(kit,ond,10,"Faltante","No visible en revisión fotográfica");
  });
  // Disco estroboscópico: faltante en A, B
  ["Kit A","Kit B"].forEach(kit => {
    mark(kit,ond,5,"Faltante","No visible en revisión fotográfica");
  });
  // Superficie parabólica: faltante en todos excepto D
  ["Kit A","Kit B","Kit C","Kit E","Kit F"].forEach(kit => {
    mark(kit,ond,17,"Faltante","No visible en revisión fotográfica");
  });

  // ══ MESA DE FUERZAS ══
  // (Datos corregidos en migración v11 con ítems del manual oficial ABC.
  //  Los estados deben verificarse manualmente con la nueva lista.)

  // ══ CALORIMETRÍA ══
  // (Datos corregidos en migración v12 con ítems del manual oficial ABC, divididos en 2 bandejas.
  //  Los estados deben verificarse manualmente con la nueva lista.)

  // ══ MECÁNICA — Kit C ══
  // Aparato de péndulo faltante solo en Kit C
  mark("Kit C",mec,1,"Faltante","No visible en revisión fotográfica — faltante significativo");
  // Cronómetro y pesas dudosos en Kit C
  mark("Kit C",mec,6,"Posible faltante","No claramente visible en revisión fotográfica");
  mark("Kit C",mec,18,"Posible faltante","No claramente visible en revisión fotográfica");
  // Segundo carro no visible en C y D
  // (ya están como qty 2 con status Presente, marcamos observación)

  // ══ ÓPTICA — Kit C ══
  // Pantalla manchada
  mark("Kit C",op,25,"Desgastado","Pantalla de proyección manchada con salpicaduras blancas");
}

function getLocs() {
  if (section === "equipos") return [...EQUIPOS_LOCATIONS, ...customEquiposLocs];
  return [...MATERIALES_LOCATIONS, ...customMaterialesLocs];
}
function isCustomLoc(locId) {
  return customMaterialesLocs.some(l=>l.id===locId) || customEquiposLocs.some(l=>l.id===locId);
}
function sectionItems() { return items.filter(i => i.section === section); }

function switchSection(s) {
  section = s;
  viewMode = "dashboard";
  currentLoc = null;
  currentDrawer = null;
  currentFilter = null;
  document.getElementById("searchInput").value = "";
  render();
}

function renderSidebar() {
  const nav = document.getElementById("sidebarNav");
  const locs = getLocs();
  const allSi = sectionItems();
  // Para lectores, solo contar ítems disponibles
  const si = userRole === "lector" ? allSi.filter(i => i.status === "Presente") : allSi;

  // Section tabs
  document.getElementById("tabMateriales").classList.toggle("active", section==="materiales");
  document.getElementById("tabEquipos").classList.toggle("active", section==="equipos");



  let html = '';
  // Dashboard link
  const dashActive = viewMode === "dashboard";
  html += `<div class="nav-group"><div class="nav-item${dashActive?' active':''}" onclick="goToDashboard()">
    <span class="mi" style="font-size:20px">dashboard</span><span>Resumen</span><span class="nav-badge">${si.length}</span>
  </div></div>`;

  locs.forEach(loc => {
    const count = si.filter(i => i.location === loc.id).length;
    const navKey = section + '::' + loc.id;
    const navExpanded = currentLoc === loc.id && (viewMode === "list" || viewMode === "drawers") && !collapsedNavLocs[navKey];
    const isActive = currentLoc === loc.id && !currentDrawer && (viewMode==="list" || viewMode==="drawers");
    html += `<div class="nav-group">`;
    const isCustom = isCustomLoc(loc.id);
    html += `<div class="nav-item${isActive?' active':''}" onclick="goToLoc('${esc(loc.id)}')">
      <span>${loc.icon}</span><span>${esc(loc.name)}${locCodes[loc.id]?'<span class="nav-code">'+esc(locCodes[loc.id])+'</span>':''}</span>
      ${isCustom && userRole==="editor"?`<span class="loc-actions"><button class="loc-act-btn" onclick="event.stopPropagation();openLocModal('${esc(loc.id)}')" title="Editar">✎</button><button class="loc-act-btn del" onclick="event.stopPropagation();deleteLoc('${esc(loc.id)}')" title="Eliminar">✕</button></span>`:''}
      <span class="mi nav-expand-icon" aria-hidden="true">${navExpanded?'expand_less':'expand_more'}</span>
      <span class="nav-badge">${count}</span>
    </div>`;
    if (navExpanded) {
      html += `<div class="nav-sub">`;
      loc.drawers.forEach(d => {
        const dCount = si.filter(i => i.location === loc.id && i.drawer === d).length;
        const isActiveD = currentDrawer === d;
        if (userRole === "lector") {
          html += `<div class="nav-item${isActiveD?' active':''}" onclick="goToDrawer('${esc(loc.id)}','${esc(d)}')">
            <span class="nav-dot" style="background:var(--green)"></span>
            <span>${esc(d.split(' ')[0])}</span>
            <span class="nav-badge">${dCount}</span>
          </div>`;
        } else {
          const hasIssue = allSi.some(i => i.location === loc.id && i.drawer === d && ["Posible faltante","Dañado","Faltante"].includes(i.status));
          html += `<div class="nav-item${isActiveD?' active':''}" onclick="goToDrawer('${esc(loc.id)}','${esc(d)}')">
            <span class="nav-dot" style="background:${hasIssue?'var(--red)':'var(--green)'}"></span>
            <span>${esc(d.split(' ')[0])}</span>
            <span class="nav-badge">${dCount}</span>
          </div>`;
        }
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Botón para agregar nueva ubicación (solo editor)
  if (userRole === "editor") html += `<div class="loc-mgmt-btn" onclick="openLocModal()"><span class="mi" style="font-size:20px">add_circle</span> Nueva ubicación</div>`;

  nav.innerHTML = html;

  // Footer
  const fCount = document.getElementById("footerCount");
  if (fCount) fCount.textContent = userRole === "lector" ? `${si.length} disponibles` : `${allSi.length} ítems`;
}

      const dn = drawerNotes[noteKey];
      if (dn) titleHtml += `<span style="font-size:11px;color:var(--amber);margin-left:8px">⚠ ${esc(dn)}</span>`;
    }
  }

  let filtered;
  if (viewMode === "list") filtered = getFiltered();
  else if (viewMode === "drawers") filtered = sectionItems().filter(i => i.location === currentLoc);
  else filtered = sectionItems();
  const pres = filtered.filter(i=>i.status==="Presente").length;
  const desg = filtered.filter(i=>i.status==="Desgastado").length;
  const bad = filtered.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;

function renderContent() {
  const el = document.getElementById("content");
  if (viewMode === "users") { renderUsersPanel(); return; }
  if (viewMode === "audit") { openAuditLog(); return; }
  if (viewMode === "solicitudes" || viewMode === "mis-solicitudes") { renderSolicitudesPanel(); return; }
  if (viewMode === "dashboard") {
    renderDashboard(el);
  } else if (viewMode === "drawers") {
    renderDrawersView(el);
  } else {
    renderTable(el);
  }
}

    const ct = di.length;
    const okC = di.filter(i=>i.status==="Presente").length;
    const warnC = di.filter(i=>i.status==="Desgastado").length;

        ${ct?`<div class="dash-loc-bar">

  let html = `<div class="dashboard-grid">

    <div class="dash-card"><div class="dash-card-label">Presente</div><div class="dash-card-value ok">${pres}</div><div class="dash-card-sub">${total?Math.round(pres/total*100):0}% del total</div></div>
    ${userRole==="editor"?`<div class="dash-card"><div class="dash-card-label">Desgastado</div><div class="dash-card-value warn">${desg}</div><div class="dash-card-sub">requieren atención</div></div>
    <div class="dash-card"><div class="dash-card-label">Faltante / Dañado</div><div class="dash-card-value bad">${falt+dan}</div><div class="dash-card-sub">${falt} posibles faltantes (huecos vacíos en espuma), ${dan} dañados</div></div>`:''}
    ${prestados?`<div class="dash-card"><div class="dash-card-label">Prestado</div><div class="dash-card-value" style="color:var(--accent)">${prestados}</div><div class="dash-card-sub">ítems en préstamo</div></div>`:''}
  </div>`;

  if (fuera > 0 || nota > 0) {
    html += `<div class="dashboard-grid" style="margin-bottom:24px">`;
    if (fuera) html += `<div class="dash-card"><div class="dash-card-label">Fuera de kit</div><div class="dash-card-value" style="color:var(--amber)">${fuera}</div></div>`;
    if (nota) html += `<div class="dash-card"><div class="dash-card-label">Notas</div><div class="dash-card-value" style="color:var(--purple)">${nota}</div></div>`;
    html += `</div>`;
  }

  html += `<div class="dash-section-title">Ubicaciones</div><div class="dash-locations">`;
  const locs = getLocs();
  locs.forEach(loc => {
    const li = si.filter(i=>i.location===loc.id);
    const ct = li.length;
    const okC = li.filter(i=>i.status==="Presente").length;
    const warnC = li.filter(i=>i.status==="Desgastado").length;
    const badC = li.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;
    const okP = ct ? (okC/ct*100) : 0;
    const warnP = ct ? (warnC/ct*100) : 0;
    const badP = ct ? (badC/ct*100) : 0;
    const isC = isCustomLoc(loc.id);
    html += `<div class="dash-loc" onclick="goToLoc('${esc(loc.id)}')" style="position:relative">
      <span class="dash-loc-icon">${loc.icon}</span>
      <div class="dash-loc-info">
        <div class="dash-loc-name">${esc(loc.name)}${locCodes[loc.id]?' <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim);font-weight:400">'+esc(locCodes[loc.id])+'</span>':' <span style="font-size:11px;color:var(--text-dim);font-style:italic">Sin código</span>'}${isC?'<span class="loc-actions" style="display:inline-flex;vertical-align:middle;margin-left:6px"><button class="loc-act-btn" onclick="event.stopPropagation();openLocModal(\''+esc(loc.id)+'\')" title="Editar">✎</button><button class="loc-act-btn del" onclick="event.stopPropagation();deleteLoc(\''+esc(loc.id)+'\')" title="Eliminar">✕</button></span>':''}</div>
        <div class="dash-loc-count">${ct} ítems · ${loc.drawers.length} ${loc.drawers[0]?.startsWith("Piso")?"pisos":section==="equipos"?"módulos":"secciones"}</div>
        ${ct?`<div class="dash-loc-bar">
          <span class="bar-ok" style="width:${okP}%"></span>
          <span class="bar-warn" style="width:${warnP}%"></span>
          <span class="bar-bad" style="width:${badP}%"></span>
        </div>`:''}
      </div>
    </div>`;
  });
  if (userRole === "editor") {
    html += `<div class="dash-loc" onclick="openLocModal()" style="border:2px dashed var(--border);background:transparent;cursor:pointer;justify-content:center;min-height:60px">
      <span style="font-size:20px;color:var(--accent)">+</span>
      <div class="dash-loc-info">
        <div class="dash-loc-name" style="color:var(--accent)">Nueva ubicación</div>
      </div>
    </div>`;
  }
  html += `</div>`;

  // Items needing attention (solo para editores)
  if (userRole === "editor") {
    const attention = si.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status));
    if (attention.length) {
      html += `<div class="dash-section-title">Requieren atención (${attention.length})</div>`;
      html += `<div class="tbl-wrap"><div class="tbl-scroll"><table>
        <thead><tr><th>Ubicación</th><th>Cajón</th><th>Material</th><th>Estado</th><th>Qué falta / Problema</th></tr></thead><tbody>`;
      attention.forEach(i => {
        html += `<tr style="cursor:pointer" onclick="goToDrawer('${esc(i.location)}','${esc(i.drawer)}')">
          <td>${esc(i.location)}</td>
          <td style="font-family:var(--mono);font-size:12px">${esc(i.drawer.split(' ')[0])}</td>
          <td>${esc(i.name)}</td>
          <td><span class="status-tag ${STATUS_CLS[i.status]||''}">${esc(i.status)}</span></td>
          <td style="font-size:12px;color:var(--text-sec)">${esc(i.observations)}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;
    }
  }

  el.innerHTML = html;
}

function renderTable(el) {
  const filtered = getFiltered();
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4M4 7l8 4M4 7v10l8 4m0-10v10"/></svg>
      <h3>Sin elementos</h3>
      <p>Usa "+ Agregar" para registrar el primer ítem en esta ubicación.</p>
    </div>`;
    return;
  }

  // Filter chips — status
  let chipHtml = `<div class="filter-bar">
    <span class="filter-chip${!currentFilter?' active':''}" onclick="setFilter(null)">Todos (${filtered.length})</span>`;
  STATUSES.forEach(s => {
    const c = filtered.filter(i=>i.status===s).length;
    if(c) chipHtml += `<span class="filter-chip${currentFilter===s?' active':''}" onclick="setFilter('${s}')">${s} (${c})</span>`;
  });
  chipHtml += `</div>`;

  // Additional combined filters when searching or at top level
  const isSearch = document.getElementById("searchInput").value.trim();
  if (isSearch) {
    // Show location grouping when in search results
    const locs = [...new Set(filtered.map(i=>i.location))].sort();
    if (locs.length > 1) {
      chipHtml += `<div class="filter-bar" style="padding-top:0">
        <span style="font-size:11px;color:var(--text-dim);padding:4px 4px;font-weight:600">Ubicación:</span>
        <span class="filter-chip${!currentLocFilter?' active':''}" onclick="setLocFilter(null)">Todas</span>`;
      locs.forEach(l => {
        const c = filtered.filter(i=>i.location===l).length;
        chipHtml += `<span class="filter-chip${currentLocFilter===l?' active':''}" onclick="setLocFilter('${esc(l)}')">${esc(l)} (${c})</span>`;
      });
      chipHtml += `</div>`;
    }
    // Show drawer grouping
    const baseFiltered = currentLocFilter ? filtered.filter(i=>i.location===currentLocFilter) : filtered;
    const drawers = [...new Set(baseFiltered.map(i=>i.drawer))].sort();
    if (drawers.length > 1 && currentLocFilter) {
      chipHtml += `<div class="filter-bar" style="padding-top:0">
        <span style="font-size:11px;color:var(--text-dim);padding:4px 4px;font-weight:600">Módulo:</span>
        <span class="filter-chip${!currentDrawerFilter?' active':''}" onclick="setDrawerFilter(null)">Todos</span>`;
      drawers.forEach(d => {
        const c = baseFiltered.filter(i=>i.drawer===d).length;
        chipHtml += `<span class="filter-chip${currentDrawerFilter===d?' active':''}" onclick="setDrawerFilter('${esc(d)}')">${esc(d)} (${c})</span>`;
      });
      chipHtml += `</div>`;
    }
  }

  let display = currentFilter ? filtered.filter(i=>i.status===currentFilter) : filtered;
  if (currentLocFilter) display = display.filter(i=>i.location===currentLocFilter);
  if (currentDrawerFilter) display = display.filter(i=>i.drawer===currentDrawerFilter);

  const isEditor = userRole === "editor";

  // Collapsible module sections: group by drawer when viewing a location (not a specific drawer) and not searching
  const useCollapsible = currentLoc && !currentDrawer && !isSearch && display.length > 0;

  function buildTableRows(itemsList) {
    let rows = '';
    itemsList.forEach(item => {
      rows += `<tr class="${selectedItems.has(item.id)?'selected-row':''}">
        ${isEditor?'<td class="chk-cell"><input type="checkbox" data-item-id="'+item.id+'" '+(selectedItems.has(item.id)?'checked':'')+' onchange="toggleSelectItem(\''+item.id+'\')"></td>':''}
        <td class="qty">${item.num}</td>
        <td>${isEditor?`<span class="editable" onclick="editField('${item.id}','name')">`:''}${esc(item.name)}${isEditor?'</span>':''}</td>
        <td>${isEditor?`<span class="editable" onclick="editField('${item.id}','brand')">`:''}${esc(item.brand)||'—'}${isEditor?'</span>':''}</td>
        <td style="font-family:var(--mono);font-size:12px">${isEditor?`<span class="editable" onclick="editField('${item.id}','serial')">`:''}${esc(item.serial||'')||'—'}${isEditor?'</span>':''}</td>
        <td class="qty">${isEditor?`<span class="editable" onclick="editField('${item.id}','quantity')">`:''}${esc(String(item.quantity))}${isEditor?'</span>':''}</td>
        <td><span class="status-tag ${STATUS_CLS[item.status]||''}" ${isEditor?`onclick="editStatus('${item.id}', event)"`:''} style="${isEditor?'':'cursor:default'}">${esc(item.status)}</span></td>
        <td style="font-size:13px">${isEditor?`<span class="editable" onclick="editField('${item.id}','observations')">`:''}${esc(item.observations)||'—'}${isEditor?'</span>':''}</td>
        <td>${isEditor?`<div class="row-actions">
          <button class="row-act" onclick="openEditModal('${item.id}')" title="Editar">&#9998;</button>
          <button class="row-act del" onclick="deleteItem('${item.id}')" title="Eliminar">&#10005;</button>
        </div>`:`<div style="display:flex;align-items:center;gap:4px">${(()=>{const l=getActiveLoans(item.id);return l>0?'<span style="font-size:10px;background:var(--amber);color:#fff;border-radius:8px;padding:1px 5px" title="'+l+' préstamo(s) activo(s)">⏳'+l+'</span>':''})()}<button class="btn-request-item" onclick="requestItem('${item.id}')" title="Solicitar préstamo">📋</button></div>`}</td>
      </tr>`;
    });
    return rows;
  }

  function buildTableHead() {
    return `<thead><tr>
      ${isEditor?'<th class="chk-cell"><input type="checkbox" onchange="toggleSelectAll()" '+((selectedItems.size===display.length&&display.length>0)?'checked':'')+'></th>':''}
      <th style="width:40px">N.°</th>
      <th>Material / Elemento</th>
      <th>Marca</th>
      <th style="width:100px">Serial</th>
      <th style="width:60px">Cant.</th>
      <th style="width:120px">Estado</th>
      <th>Observaciones</th>
      <th style="width:${isEditor?'70':'80'}px"></th>
    </tr></thead>`;
  }

  let tHtml = '';

  if (useCollapsible) {
    // Group items by drawer
    const drawers = [];
    const drawerMap = {};
    display.forEach(item => {
      if (!drawerMap[item.drawer]) {
        drawerMap[item.drawer] = [];
        drawers.push(item.drawer);
      }
      drawerMap[item.drawer].push(item);
    });

    drawers.forEach((drawer, idx) => {
      const dItems = drawerMap[drawer];
      const okC = dItems.filter(i=>i.status==="Presente").length;
      const warnC = dItems.filter(i=>i.status==="Desgastado").length;
      const badC = dItems.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;
      const statusSummary = [];
      if (okC) statusSummary.push(`<span style="color:var(--green)">${okC} ✓</span>`);
      if (warnC) statusSummary.push(`<span style="color:var(--amber)">${warnC} ⚠</span>`);
      if (badC) statusSummary.push(`<span style="color:var(--red)">${badC} ✕</span>`);
      const isExpanded = expandedModules[currentLoc + '::' + drawer] !== false;
      tHtml += `<div class="module-section">
        <div class="module-header ${isExpanded?'expanded':''}" onclick="toggleModule('${esc(currentLoc)}','${esc(drawer)}',this)">
          <span class="module-icon">▾</span>
          <span class="module-title">${esc(drawer)}</span>
          <span style="font-size:13px;display:flex;gap:10px;margin-right:8px">${statusSummary.join(' ')}</span>
          <span class="module-count">${dItems.length} ítems</span>
        </div>
        <div class="module-body ${isExpanded?'open':''}">
          <div class="tbl-wrap" style="border-radius:0;box-shadow:none"><div class="tbl-scroll"><table>
            ${buildTableHead()}
            <tbody>${buildTableRows(dItems)}</tbody>
          </table></div></div>
        </div>
      </div>`;
    });
  } else {
    tHtml = `<div class="tbl-wrap"><div class="tbl-scroll"><table>
      ${buildTableHead()}
      <tbody>${buildTableRows(display)}</tbody>
    </table></div></div>`;
  }

  el.innerHTML = chipHtml + tHtml;
}

function getFiltered() {
  let si = sectionItems();
  // Lectores solo ven ítems disponibles para préstamo
  if (userRole === "lector") {
    si = si.filter(i => i.status === "Presente");
  }
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  if (search) {
    return si.filter(i =>
      i.name.toLowerCase().includes(search) ||
      i.brand.toLowerCase().includes(search) ||
      (i.serial||'').toLowerCase().includes(search) ||
      i.observations.toLowerCase().includes(search) ||
      i.drawer.toLowerCase().includes(search) ||
      i.location.toLowerCase().includes(search)
    ).sort((a,b)=>a.num-b.num);
  }
  let r = si;
  if (currentLoc) r = r.filter(i=>i.location===currentLoc);
  if (currentDrawer) r = r.filter(i=>i.drawer===currentDrawer);
  return r.sort((a,b)=>a.num-b.num);
}

function render() { renderSidebar(); renderTopbar(); renderContent(); updateRoleUI(); }

function getActiveTheme() {
  const theme = document.documentElement.dataset.theme;
  if (theme === "light" || theme === "dark") return theme;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function updateThemeToggle() {
  const button = document.getElementById("themeToggle");
  if (!button) return;
  const isDark = getActiveTheme() === "dark";
  const nextTheme = isDark ? "claro" : "oscuro";
  button.innerHTML = `<span class="mi">${isDark ? "light_mode" : "dark_mode"}</span> Cambiar a modo ${nextTheme}`;
  button.setAttribute("aria-label", `Cambiar a modo ${nextTheme}`);
  button.setAttribute("aria-pressed", String(isDark));
}

function toggleTheme() {
  const nextTheme = getActiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nextTheme;
  try { localStorage.setItem("inv_theme", nextTheme); } catch(e) {}
  updateThemeToggle();
}

function goToDashboard() {
  viewMode = "dashboard";
  currentLoc = null;
  currentLocFilter = null;
  currentDrawerFilter = null;
  currentDrawer = null;
  currentFilter = null;
  render();
  closeMobile();
}

function goToLoc(loc) {
  const navKey = section + '::' + loc;
  const isExpanded = currentLoc === loc && viewMode === "drawers" && !collapsedNavLocs[navKey];
  if (isExpanded) {
    collapsedNavLocs[navKey] = true;
    saveCollapsedNavLocs();
    renderSidebar();
    closeMobile();
    return;
  }
  collapsedNavLocs[navKey] = false;
  saveCollapsedNavLocs();
  viewMode = "drawers";
  currentLoc = loc;
  currentDrawer = null;
  currentFilter = null;
  render();
  closeMobile();
}

function goToDrawer(loc, drawer) {
  viewMode = "list";
  currentLoc = loc;
  currentDrawer = drawer;
  currentFilter = null;
  render();
  closeMobile();
}

function setFilter(f) { currentFilter = f; renderContent(); }
function setLocFilter(f) { currentLocFilter = f; currentDrawerFilter = null; renderContent(); }
function setDrawerFilter(f) { currentDrawerFilter = f; renderContent(); }
function toggleModule(loc, drawer, headerEl) {
  const key = loc + '::' + drawer;
  const isOpen = expandedModules[key] !== false;
  expandedModules[key] = !isOpen;
  saveExpandedModules();
  const body = headerEl.nextElementSibling;
  if (body) { body.classList.toggle('open', !isOpen); }
  headerEl.classList.toggle('expanded', !isOpen);
}
function collapseAllModules() {
  if (!currentLoc) return;
  const loc = getLocs().find(l => l.id === currentLoc);
  if (!loc) return;
  loc.drawers.forEach(d => { expandedModules[currentLoc + '::' + d] = false; });
  saveExpandedModules();
  renderContent();
}
function expandAllModules() {
  if (!currentLoc) return;
  const loc = getLocs().find(l => l.id === currentLoc);
  if (!loc) return;
  loc.drawers.forEach(d => { expandedModules[currentLoc + '::' + d] = true; });
  saveExpandedModules();
  renderContent();
}

let _searchDebounce;
document.getElementById("searchInput").addEventListener("input", function() {
  const self = this;
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(function() {
    if (self.value.trim()) { viewMode = "list"; currentLoc = null; currentDrawer = null; currentFilter = null; currentLocFilter = null; currentDrawerFilter = null; }
    else { currentLocFilter = null; currentDrawerFilter = null; }
    selectedItems.clear();
    render();
  }, 250);
});
