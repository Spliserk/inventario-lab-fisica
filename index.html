function editField(id, field) {
  const item = items.find(i=>i.id===id);
  if(!item) return;
  // Find the clicked editable span and replace with inline input
  const spans = document.querySelectorAll(`.editable[onclick*="'${id}','${field}'"]`);
  const span = spans[0];
  if (!span) return;
  const currentVal = item[field] || '';
  const wrap = document.createElement('div');
  wrap.className = 'inline-edit-wrap';
  const isTextarea = field === 'observations';
  const inputEl = document.createElement(isTextarea ? 'textarea' : 'input');
  inputEl.className = 'inline-edit-input';
  inputEl.value = currentVal;
  if (isTextarea) { inputEl.rows = 2; }
  if (field === 'quantity') { inputEl.type = 'number'; inputEl.min = '0'; }
  const actions = document.createElement('div');
  actions.className = 'inline-edit-actions';
  actions.innerHTML = '<button onclick="confirmInlineEdit(this)" title="Guardar">✓</button><button onclick="cancelInlineEdit(this)" title="Cancelar">✕</button>';
  wrap.appendChild(inputEl);
  wrap.appendChild(actions);
  wrap.dataset.itemId = id;
  wrap.dataset.field = field;
  span.replaceWith(wrap);
  inputEl.focus();
  inputEl.select();
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !isTextarea) { e.preventDefault(); confirmInlineEdit(inputEl); }
    if (e.key === 'Escape') cancelInlineEdit(inputEl);
  });
}

function confirmInlineEdit(el) {
  const wrap = el.closest('.inline-edit-wrap');
  if (!wrap) return;
  const id = wrap.dataset.itemId;
  const field = wrap.dataset.field;
  const input = wrap.querySelector('.inline-edit-input');
  const val = input.value;
  const item = items.find(i=>i.id===id);
  if (item) {
    const oldVal = item[field];
    item[field] = val;
    logAction("editar_campo", `${field}: "${oldVal}" → "${val}" (ítem: ${item.name})`);
    saveData();
    render();
    toast("Actualizado");
  }
}

function cancelInlineEdit(el) {
  render(); // Re-render restores original state
}

function editStatus(id, event) {
  const item = items.find(i=>i.id===id);
  if(!item) return;
  // Remove any existing dropdown
  closeStatusDropdown();

  const STATUS_COLORS = {
    "Presente":"var(--green)","Desgastado":"var(--amber)",
    "Posible faltante":"var(--red)","Dañado":"var(--red)",
    "Nota":"var(--purple)","Faltante":"var(--red)","Fuera":"var(--amber)",
    "Prestado":"var(--accent)"
  };

  // Create overlay to close on outside click
  const overlay = document.createElement('div');
  overlay.className = 'status-dropdown-overlay';
  overlay.onclick = closeStatusDropdown;
  document.body.appendChild(overlay);

  // Create dropdown
  const dd = document.createElement('div');
  dd.className = 'status-dropdown';
  dd.id = 'activeStatusDropdown';
  STATUSES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'status-dropdown-item' + (s === item.status ? ' selected' : '');
    btn.innerHTML = `<span class="status-dropdown-dot" style="background:${STATUS_COLORS[s]||'var(--text-dim)'}"></span>${s}${s === item.status ? ' ✓' : ''}`;
    btn.onclick = function(e) {
      e.stopPropagation();
      item.status = s;
      saveData();
      closeStatusDropdown();
      render();
      toast("Estado: " + s);
    };
    dd.appendChild(btn);
  });

  // Position near the clicked element
  const rect = event.target.closest('.status-tag').getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.left = rect.left + 'px';
  dd.style.top = (rect.bottom + 4) + 'px';
  // Ensure it doesn't go off screen
  document.body.appendChild(dd);
  const ddRect = dd.getBoundingClientRect();
  if (ddRect.right > window.innerWidth - 8) {
    dd.style.left = Math.max(8, window.innerWidth - ddRect.width - 8) + 'px';
  }
  if (ddRect.bottom > window.innerHeight - 8) {
    dd.style.top = (rect.top - ddRect.height - 4) + 'px';
  }
}

function closeStatusDropdown() {
  const dd = document.getElementById('activeStatusDropdown');
  if (dd) dd.remove();
  const overlay = document.querySelector('.status-dropdown-overlay');
  if (overlay) overlay.remove();
}

function exportCSV() {
  const si = sectionItems();
  const bom = "﻿";
  let csv = bom + "Ubicación,Código Inventario,Cajón,N.°,Material,Marca,Serial,Cantidad,Estado,Observaciones\n";
  si.forEach(i => {
    const e=s=>(s||"").toString().replace(/"/g,'""')
    csv += [`"${e(i.location)}"`,`"${e(locCodes[i.location])}"`,`"${e(i.drawer)}"`,i.num,`"${e(i.name)}"`,`"${e(i.brand)}"`,`"${e(i.serial)}"`,i.quantity,`"${e(i.status)}"`,`"${e(i.observations)}"`].join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `inventario-${section}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exportado");
}

function saveLoc(editId) {
  const name = document.getElementById('loc-name').value.trim();
  if (!name) { toast("Ingresa un nombre"); return; }
  const icon = document.getElementById('loc-icon').value;
  const sec = document.getElementById('loc-section').value;
  const drawerEls = document.querySelectorAll('#drawerList input');
  const drawers = [];
  drawerEls.forEach(el => {
    const v = el.value.trim();
    if (v) drawers.push(v);
  });
  if (drawers.length === 0) { toast("Agrega al menos 1 sección"); return; }

  const targetArr = sec === "equipos" ? customEquiposLocs : customMaterialesLocs;

  if (editId) {
    // Edit existing
    const idx = targetArr.findIndex(l=>l.id===editId);
    if (idx === -1) return;
    const oldName = targetArr[idx].id;
    targetArr[idx].name = name;
    targetArr[idx].icon = icon;
    // Update drawers — keep existing drawer names that items reference
    const oldDrawers = targetArr[idx].drawers;
    targetArr[idx].drawers = drawers;
    // If id (name) changed, update items
    if (oldName !== name) {
      targetArr[idx].id = name;
      items.forEach(i => { if (i.location === oldName) i.location = name; });
    }
    // If drawer names changed, update items
    oldDrawers.forEach((od, di) => {
      if (drawers[di] && drawers[di] !== od) {
        items.forEach(i => { if (i.location === name && i.drawer === od) i.drawer = drawers[di]; });
      }
    });
  } else {
    // Check unique name
    const allLocs = getLocs();
    if (allLocs.some(l=>l.id===name)) { toast("Ya existe una ubicación con ese nombre"); return; }
    targetArr.push({ id: name, name: name, icon: icon, drawers: drawers });
  }

  saveData();
  closeModal();
  render();
  toast(editId ? "Ubicación actualizada" : "Ubicación creada");
}

function deleteLoc(locId) {
  if (!isCustomLoc(locId)) return;
  const locItems = items.filter(i => i.location === locId);
  const msg = locItems.length > 0
    ? `"${locId}" tiene ${locItems.length} ítem(s). ¿Eliminar la ubicación y todos sus ítems?`
    : `¿Eliminar la ubicación "${locId}"?`;
  showConfirm(msg, function() {
    // Remove items in this location
    items = items.filter(i => i.location !== locId);
    // Remove from custom arrays
    customMaterialesLocs = customMaterialesLocs.filter(l=>l.id!==locId);
    customEquiposLocs = customEquiposLocs.filter(l=>l.id!==locId);
    // Clean up locCodes
    delete locCodes[locId];
    // If currently viewing this location, go to dashboard
    if (currentLoc === locId) { currentLoc = null; currentDrawer = null; viewMode = "dashboard"; }
    saveData();
    render();
    toast("Ubicación eliminada");
  });
}

// Default editor password (used only on first run or if Firestore doc doesn't exist yet)
const DEFAULT_EDITOR_PASS = "labfisica2024";
let editorPassCache = null; // cache from Firestore to avoid re-fetching

// Load editor password from Firestore (or create default doc)
async function loadEditorPassword() {
  if (!firestoreReady || !db) return DEFAULT_EDITOR_PASS;
  try {
    const doc = await db.collection("config").doc("editor").get();
    if (doc.exists) {
      editorPassCache = doc.data().password;
      return editorPassCache;
    } else {
      // First time: create the config doc with default password
      await db.collection("config").doc("editor").set({ password: DEFAULT_EDITOR_PASS, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      editorPassCache = DEFAULT_EDITOR_PASS;
      return DEFAULT_EDITOR_PASS;
    }
  } catch(e) {
    console.warn("Could not load editor password from Firestore:", e);
    return editorPassCache || DEFAULT_EDITOR_PASS;
  }
}

function switchLoginTab(tab) {
  loginTabMode = tab;
  document.getElementById("ltEditor").classList.toggle("active", tab==="editor");
  document.getElementById("ltLector").classList.toggle("active", tab==="lector");
  document.getElementById("loginEditorFields").hidden = tab !== "editor";
  document.getElementById("loginLectorFields").hidden = tab !== "lector";
  document.getElementById("loginBtn").textContent = tab==="editor" ? "Ingresar como Editor" : "Ingresar como Lector";
  document.getElementById("loginBtn").onclick = tab==="editor" ? doLogin : doLoginLector;
  document.getElementById("loginHint").textContent = tab==="editor" ? "Acceso completo al inventario" : "Solo lectura — puede solicitar equipos";
  document.getElementById("loginError").textContent = "";
}

async function doLogin() {
  const input = document.getElementById("loginPass").value;
  if (!input) {
    document.getElementById("loginError").textContent = "Ingrese la contraseña";
    return;
  }
  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginBtn").textContent = "Verificando...";
  try {
    const correctPass = await loadEditorPassword();
    const inputHash = await hashPassword(input);
    // Support both hashed and legacy plaintext passwords
    if (inputHash === correctPass || input === correctPass) {
      // If matched plaintext, migrate to hash now
      if (input === correctPass && correctPass.length !== 64) {
        try {
          const hashed = await hashPassword(input);
          await db.collection("config").doc("editor").update({ password: hashed, migrated: true });
          editorPassCache = hashed;
        } catch(e) {}
      }
      userRole = "editor";
      userName = "Editor";
      try { localStorage.setItem("inv_auth", generateAuthToken("editor","Editor")); } catch(e) {}
      document.getElementById("loginOverlay").hidden = true;
      document.getElementById("appMain").hidden = false;
      document.getElementById("loginError").textContent = "";
      loadSolicitudes();
      render();
    } else {
      document.getElementById("loginError").textContent = "Contraseña incorrecta";
      document.getElementById("loginPass").value = "";
      document.getElementById("loginPass").focus();
    }
  } catch(e) {
    document.getElementById("loginError").textContent = "Error de conexión";
  }
  document.getElementById("loginBtn").disabled = false;
  document.getElementById("loginBtn").textContent = "Ingresar como Editor";
}

async function doLoginLector() {
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginUserPass").value;
  if (!user || !pass) {
    document.getElementById("loginError").textContent = "Ingrese usuario y contraseña";
    return;
  }
  if (!firestoreReady) {
    document.getElementById("loginError").textContent = "Sin conexión al servidor";
    return;
  }
  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginBtn").textContent = "Verificando...";
  try {
    const snap = await db.collection("usuarios").where("username","==",user.toLowerCase()).get();
    if (snap.empty) {
      document.getElementById("loginError").textContent = "Usuario no encontrado";
      document.getElementById("loginUser").focus();
    } else {
      const doc = snap.docs[0];
      const data = doc.data();
      const passHash = await hashPassword(pass);
      // Support both hashed and legacy plaintext passwords
      if (data.password === passHash || data.password === pass) {
        // If matched plaintext, migrate to hash now
        if (data.password === pass && pass.length !== 64) {
          try { await db.collection("usuarios").doc(doc.id).update({ password: passHash }); } catch(e) {}
        }
        userRole = "lector";
        userName = data.displayName || user;
        userEmail = data.email || null;
        try {
          localStorage.setItem("inv_auth", generateAuthToken("lector", user.toLowerCase()));
          localStorage.setItem("inv_auth_user", user.toLowerCase());
        } catch(e) {}
        document.getElementById("loginOverlay").hidden = true;
        document.getElementById("appMain").hidden = false;
        document.getElementById("loginError").textContent = "";
        loadSolicitudes();
        render();
      } else {
        document.getElementById("loginError").textContent = "Contraseña incorrecta";
        document.getElementById("loginUserPass").value = "";
        document.getElementById("loginUserPass").focus();
      }

async function saveEditorPassword() {
  const current = document.getElementById("cp-current").value;
  const newPass = document.getElementById("cp-new").value;
  const confirm = document.getElementById("cp-confirm").value;
  const errEl = document.getElementById("cp-error");

  if (!current || !newPass || !confirm) { errEl.textContent = "Complete todos los campos"; return; }

  const correctPass = await loadEditorPassword();
  const currentHash = await hashPassword(current);
  // Support both hashed and legacy plaintext
  if (currentHash !== correctPass && current !== correctPass) { errEl.textContent = "Contraseña actual incorrecta"; return; }
  if (newPass.length < 4) { errEl.textContent = "La nueva contraseña debe tener al menos 4 caracteres"; return; }
  if (newPass !== confirm) { errEl.textContent = "Las contraseñas no coinciden"; return; }

  if (!firestoreReady || !db) { errEl.textContent = "Sin conexión al servidor"; return; }

  document.getElementById("cp-save-btn").disabled = true;
  document.getElementById("cp-save-btn").textContent = "Guardando...";
  try {
    const hashedNew = await hashPassword(newPass);
    await db.collection("config").doc("editor").set({
      password: hashedNew,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    editorPassCache = hashedNew;
    logAction("cambiar_contraseña_editor", "Contraseña de editor actualizada");
    closeModal();
    toast("Contraseña de editor actualizada");
  } catch(e) {
    console.error("Error saving editor password:", e);
    errEl.textContent = "Error al guardar. Intente de nuevo.";
    document.getElementById("cp-save-btn").disabled = false;
    document.getElementById("cp-save-btn").textContent = "Guardar";
  }
}

async function checkAuth() {
  try {
    const auth = localStorage.getItem("inv_auth");
    // Support new token format and legacy strings
    const token = parseAuthToken(auth);
    if (token && token.role === "editor") {
      userRole = "editor";
      userName = "Editor";
      document.getElementById("loginOverlay").hidden = true;
      document.getElementById("appMain").hidden = false;
      loadSolicitudes();
      return;
    }
    // Legacy support
    if (auth === "editor" || auth === "1") {
      userRole = "editor";
      userName = "Editor";
      try { localStorage.setItem("inv_auth", generateAuthToken("editor","Editor")); } catch(e) {}
      document.getElementById("loginOverlay").hidden = true;
      document.getElementById("appMain").hidden = false;
      loadSolicitudes();
      return;
    }
    if ((token && token.role === "lector") || auth === "lector") {
      const savedUser = localStorage.getItem("inv_auth_user") || (token && token.username);
      if (savedUser && firestoreReady) {
        try {
          const snap = await db.collection("usuarios").where("username","==",savedUser).get();
          if (!snap.empty) {
            const data = snap.docs[0].data();
            userRole = "lector";
            userName = data.displayName || savedUser;
            userEmail = data.email || null;
            document.getElementById("loginOverlay").hidden = true;
            document.getElementById("appMain").hidden = false;
            loadSolicitudes();
            render();
            return;
          }
        } catch(e) {}
      }
      try { localStorage.removeItem("inv_auth"); localStorage.removeItem("inv_auth_user"); } catch(e) {}
    }
  } catch(e) {}
  document.getElementById("loginOverlay").hidden = false;
  document.getElementById("appMain").hidden = true;
  document.getElementById("loginPass").focus();
}

function filterUsers(query) {
  const term = query.trim().toLocaleLowerCase();
  const cards = document.querySelectorAll(".user-card");
  let visibleCount = 0;
  cards.forEach(card => {
    const matches = card.dataset.search.includes(term);
    card.hidden = !matches;
    if (matches) visibleCount++;
  });
  const noResults = document.getElementById("usersNoResults");
  if (noResults) noResults.hidden = visibleCount > 0;
}

async function saveNewUser() {
  const displayName = document.getElementById("f-newname").value.trim();
  const email = document.getElementById("f-newemail").value.trim();
  const username = document.getElementById("f-newuser").value.trim().toLowerCase();
  const password = document.getElementById("f-newpass").value;
  if (!displayName) { toast("Ingrese un nombre"); return; }
  if (!email) { toast("Ingrese un correo electrónico"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("Correo electrónico no válido"); return; }
  if (!username || username.length < 3) { toast("Usuario debe tener al menos 3 caracteres"); return; }
  if (!password || password.length < 4) { toast("Contraseña debe tener al menos 4 caracteres"); return; }
  if (!firestoreReady) { toast("Sin conexión a Firestore"); return; }

  try {
    const existing = await db.collection("usuarios").where("username","==",username).get();
    if (!existing.empty) { toast("Ese nombre de usuario ya existe"); return; }

    const hashedPass = await hashPassword(password);
    await db.collection("usuarios").add({
      username: username,
      displayName: displayName,
      email: email,
      password: hashedPass,
      role: "lector",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    logAction("crear_usuario", displayName + " (@" + username + ")");
    closeModal();
    toast("Usuario '" + displayName + "' creado");
    renderUsersPanel();
  } catch(e) {
    console.error("Error creating user:", e);
    toast("Error al crear usuario");

async function loadSolicitudes() {
  if (!firestoreReady) return;
  try {
    const snap = await db.collection("solicitudes").orderBy("createdAt","desc").get();
    solicitudes = [];
    snap.forEach(doc => { solicitudes.push({ id: doc.id, ...doc.data() }); });
  } catch(e) { console.warn("Error loading solicitudes:", e); }
  // Listen for real-time updates
  try {
    db.collection("solicitudes").orderBy("createdAt","desc").onSnapshot(snap => {
      solicitudes = [];
      snap.forEach(doc => { solicitudes.push({ id: doc.id, ...doc.data() }); });
      // Re-render if viewing solicitudes
      if (viewMode === "solicitudes" || viewMode === "mis-solicitudes") renderContent();

  } catch(e) {}
}

// ═══════════════════════════════════════
//  EMAIL NOTIFICATIONS (EmailJS)
// ═══════════════════════════════════════
async function sendEmailNotification(sol, newStatus) {
  // No enviar si EmailJS no está configurado
  if (typeof emailjs === "undefined" || EMAILJS_PUBLIC_KEY === "TU_PUBLIC_KEY") {
    console.log("EmailJS no configurado, saltando notificación");
    return;
  }
  // Buscar correo: primero en la solicitud, si no en la colección de usuarios
  let toEmail = sol.requestEmail;
  if (!toEmail && sol.requestedBy && firestoreReady) {
    try {
      const usersSnap = await db.collection("usuarios").get();
      for (const doc of usersSnap.docs) {
        const u = doc.data();
        if ((u.displayName === sol.requestedBy || u.username === sol.requestedBy) && u.email) {
          toEmail = u.email;
          break;
        }
      }
    } catch(e) { console.warn("Error buscando email del usuario:", e); }
  }
  if (!toEmail) { console.log("No email for user " + sol.requestedBy + ", skipping notification"); toast("⚠ Usuario sin correo — no se envió notificación"); return; }

  const statusMessages = {
    "aprobada": {
      subject: "✅ Préstamo Aprobado",
      message: `Tu solicitud de préstamo ha sido APROBADA.\n\nÍtem: ${sol.itemName}\nUbicación: ${sol.location} → ${sol.drawer}\nCantidad: ${sol.quantity || 1}\nFecha de devolución: ${sol.returnDate || "No especificada"}\n\nPuedes pasar a recoger el equipo al laboratorio de física.`
    },
    "rechazada": {
      subject: "❌ Solicitud Rechazada",
      message: `Tu solicitud de préstamo ha sido RECHAZADA.\n\nÍtem: ${sol.itemName}\nUbicación: ${sol.location} → ${sol.drawer}\n\nSi tienes dudas, consulta con el encargado del laboratorio.`
    },
    "devuelto": {
      subject: "🔄 Devolución Registrada",
      message: `Se ha registrado la devolución del equipo.\n\nÍtem: ${sol.itemName}\n\nGracias por devolver el equipo en buen estado.`
    }
  };

  const info = statusMessages[newStatus];
  if (!info) return;

  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: toEmail,
      name: sol.requestedBy,
      subject: info.subject,
      message: info.message,
      email: toEmail
    });
    console.log("Email notification sent to", toEmail);
    toast("📧 Notificación enviada a " + toEmail);
  } catch(e) {
    console.warn("Error sending email notification:", e);
    toast("⚠ Error al enviar notificación por correo");
  }
}

async function updateSolicitud(solId, newStatus) {
  if (!firestoreReady) return;
  try {
    const sol = solicitudes.find(s => s.id === solId);
    const update = { status: newStatus };
    if (newStatus === "aprobada") {
      update.approvedAt = firebase.firestore.FieldValue.serverTimestamp();
      // Cambiar estado del ítem a "Prestado" automáticamente
      if (sol && sol.itemId) {
        const item = items.find(i => i.id === sol.itemId);
        if (item && item.status === "Presente") {
          item.status = "Prestado";
          item.observations = `Prestado a ${sol.requestedBy} — Devolver: ${sol.returnDate || "sin fecha"}`;
          saveData();
          logAction("status", `${item.name} → Prestado (préstamo aprobado a ${sol.requestedBy})`);
        }
      }
    }
    if (newStatus === "devuelto") {
      update.returnedAt = firebase.firestore.FieldValue.serverTimestamp();
      // Restaurar estado del ítem a "Presente"
      if (sol && sol.itemId) {
        const item = items.find(i => i.id === sol.itemId);
        if (item && item.status === "Prestado") {
          item.status = "Presente";
          item.observations = "";
          saveData();
          logAction("status", `${item.name} → Presente (devolución de ${sol.requestedBy})`);
        }
      }
    }
    await db.collection("solicitudes").doc(solId).update(update);
    // Enviar notificación por correo
    if (sol) sendEmailNotification(sol, newStatus);
    toast(newStatus === "aprobada" ? "Préstamo aprobado — ítem marcado como Prestado" : newStatus === "rechazada" ? "Solicitud rechazada" : "Devolución registrada — ítem disponible");
    render();
  } catch(e) { toast("Error al actualizar"); }
}


// ═══════════════════════════════════════
//  BACKUP & RESTORE
// ═══════════════════════════════════════
function exportBackup() {
  const backup = {
    version: "backup_v1",
    date: new Date().toISOString(),
    section: section,
    items: items,
    nextId: nextId,
    locCodes: locCodes,
    drawerNotes: drawerNotes,
    customMaterialesLocs: customMaterialesLocs,
    customEquiposLocs: customEquiposLocs
  };
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `inventario-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logAction("exportar_backup", `${items.length} ítems`);
  toast("Backup descargado");
}

function importBackup() {
  const input = document.getElementById("importFileInput");
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        if (file.name.endsWith('.json')) {
          importFromJSON(ev.target.result);
        } else if (file.name.endsWith('.csv')) {
          importFromCSV(ev.target.result);
        } else {
          toast("Formato no soportado. Use .json o .csv");
        }
      } catch(err) {
        console.error("Import error:", err);
        toast("Error al importar: " + err.message);
      }
    };
    reader.readAsText(file);
    input.value = "";
  };
  input.click();
}

function importFromJSON(text) {
  const data = JSON.parse(text);
  if (!data.items || !Array.isArray(data.items)) {
    toast("JSON inválido: no contiene ítems"); return;
  }
  showConfirm(`¿Importar ${data.items.length} ítems desde backup? Los datos actuales serán reemplazados.`, function() {
    items = data.items;
    nextId = data.nextId || Math.max(0, ...items.map(i=>parseInt(i.id)||0)) + 1;
    if (data.locCodes) locCodes = data.locCodes;
    if (data.drawerNotes) drawerNotes = data.drawerNotes;
    if (data.customMaterialesLocs) customMaterialesLocs = data.customMaterialesLocs;
    if (data.customEquiposLocs) customEquiposLocs = data.customEquiposLocs;
    logAction("importar_backup", `${items.length} ítems desde JSON`);
    saveData(); render();
    toast(`${items.length} ítems importados`);
  });
}

function importFromCSV(text) {
  const lines = text.split("\n").filter(l => l.trim());
  if (lines.length < 2) { toast("CSV vacío"); return; }
  // Parse header
  const header = parseCSVLine(lines[0]);
  const nameIdx = header.findIndex(h => /material|nombre|name/i.test(h));
  const locIdx = header.findIndex(h => /ubicaci|location/i.test(h));
  const drawerIdx = header.findIndex(h => /caj[oó]n|drawer|piso/i.test(h));
  const statusIdx = header.findIndex(h => /estado|status/i.test(h));
  const brandIdx = header.findIndex(h => /marca|brand/i.test(h));
  const serialIdx = header.findIndex(h => /serial/i.test(h));
  const qtyIdx = header.findIndex(h => /cant|quantity|qty/i.test(h));
  const obsIdx = header.findIndex(h => /observ|obs|notas/i.test(h));
  const numIdx = header.findIndex(h => /^n\.?°?$|^num/i.test(h));

  if (nameIdx === -1) { toast("CSV debe tener columna 'Material' o 'Nombre'"); return; }

  const newItems = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (!cols[nameIdx]?.trim()) continue;
    newItems.push({
      id: String(nextId++),
      section: section,
      location: cols[locIdx]?.trim() || currentLoc || "Sin ubicación",
      drawer: cols[drawerIdx]?.trim() || currentDrawer || "Sin sección",
      num: parseInt(cols[numIdx]) || i,
      name: cols[nameIdx].trim(),
      brand: cols[brandIdx]?.trim() || "",
      serial: cols[serialIdx]?.trim() || "",
      quantity: cols[qtyIdx]?.trim() || "1",
      status: cols[statusIdx]?.trim() || "Presente",
      observations: cols[obsIdx]?.trim() || ""
    });
  }

  if (newItems.length === 0) { toast("No se encontraron ítems en el CSV"); return; }

  showConfirm(`Se encontraron ${newItems.length} ítems en el CSV. ¿Agregar al inventario actual?`, function() {
    items.push(...newItems);
    logAction("importar_csv", `${newItems.length} ítems desde CSV`);
    saveData(); render();
    toast(`${newItems.length} ítems importados desde CSV`);
  });
}

function parseCSVLine(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      result.push(current); current = "";
    } else {
      current += c;
    }
  }
  result.push(current);
  return result;
}

// ═══════════════════════════════════════
//  AUDIT LOG VIEW
// ═══════════════════════════════════════
async function openAuditLog() {
  if (!firestoreReady) { toast("Sin conexión"); return; }
  currentLoc = null; currentDrawer = null;
  viewMode = "audit";

  const el = document.getElementById("content");
  el.innerHTML = '<div style="max-width:700px;margin:0 auto;padding:20px"><h2 style="font-family:var(--sans);font-size:18px;margin-bottom:16px">Historial de Cambios</h2><p style="color:var(--text-sec)">Cargando...</p></div>';

  try {
    const snap = await db.collection("historial").orderBy("timestamp","desc").limit(100).get();
    let html = '<div style="max-width:700px;margin:0 auto;padding:20px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
    html += '<h2 style="font-family:var(--sans);font-size:18px;margin:0">Historial de Cambios</h2>';
    html += '<button class="btn btn-sm" onclick="goToDashboard()">← Volver</button></div>';

    if (snap.empty) {
      html += '<p style="color:var(--text-sec);text-align:center;padding:30px 0">No hay registros aún</p>';
    } else {
      html += '<div style="border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden">';
      snap.forEach(doc => {
        const d = doc.data();
        const date = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString("es-CO") : "—";
        html += `<div class="log-entry">
          <div style="display:flex;justify-content:space-between"><span class="log-action">${esc(d.action)}</span><span class="log-time">${date}</span></div>
          <div class="log-detail">${esc(d.details)}</div>
          <div style="font-size:11px;color:var(--text-dim)">👤 ${esc(d.user)} · ${esc(d.section||"")}</div>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div style="max-width:700px;margin:0 auto;padding:20px"><p style="color:var(--red)">Error cargando historial</p></div>';
  }
}

}
