<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Lab Física — UNISANGIL</title>
<meta name="description" content="Sistema de inventario del Laboratorio de Física - UNISANGIL / ABC Laboratorios S.A.S.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F0F2F6;
  --surface: #FFFFFF;
  --surface-alt: #F5F7FA;
  --surface-raised: #FFFFFF;
  --text: #1B2030;
  --text-sec: #556070;
  --text-dim: #8D96A4;
  --border: #D8DDE6;
  --border-light: #E8ECF1;
  --accent: #1A6B8A;
  --accent-hover: #145A75;
  --accent-soft: #E6F1F6;
  --green: #2D8F65;
  --green-bg: #E8F5EF;
  --green-bdr: #A8DCC3;
  --amber: #A87A25;
  --amber-bg: #FBF3E0;
  --amber-bdr: #E8D49A;
  --red: #B83B3B;
  --red-bg: #FCEAEA;
  --red-bdr: #E8AAAA;
  --purple: #6B4FA0;
  --purple-bg: #F0ECF8;
  --shadow-s: 0 1px 3px rgba(20,30,60,0.06);
  --shadow-m: 0 4px 12px rgba(20,30,60,0.08);
  --radius: 6px;
  --radius-lg: 10px;
  --sans: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'Consolas', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419;
    --surface: #1A1E26;
    --surface-alt: #1F242E;
    --surface-raised: #232830;
    --text: #DEE2EA;
    --text-sec: #99A0AE;
    --text-dim: #626A78;
    --border: #2A303A;
    --border-light: #242930;
    --accent: #5AB4D4;
    --accent-hover: #7CC8E2;
    --accent-soft: #162A35;
    --green: #5CC996;
    --green-bg: #142A20;
    --green-bdr: #1E4030;
    --amber: #E0B050;
    --amber-bg: #2A2414;
    --amber-bdr: #3A3018;
    --red: #E07070;
    --red-bg: #2A1818;
    --red-bdr: #3A2020;
    --purple: #A88ED8;
    --purple-bg: #1E1830;
    --shadow-s: 0 1px 3px rgba(0,0,0,0.25);
    --shadow-m: 0 4px 12px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #111419;
  --surface: #1A1E26;
  --surface-alt: #1F242E;
  --surface-raised: #232830;
  --text: #DEE2EA;
  --text-sec: #99A0AE;
  --text-dim: #626A78;
  --border: #2A303A;
  --border-light: #242930;
  --accent: #5AB4D4;
  --accent-hover: #7CC8E2;
  --accent-soft: #162A35;
  --green: #5CC996;
  --green-bg: #142A20;
  --green-bdr: #1E4030;
  --amber: #E0B050;
  --amber-bg: #2A2414;
  --amber-bdr: #3A3018;
  --red: #E07070;
  --red-bg: #2A1818;
  --red-bdr: #3A2020;
  --purple: #A88ED8;
  --purple-bg: #1E1830;
  --shadow-s: 0 1px 3px rgba(0,0,0,0.25);
  --shadow-m: 0 4px 12px rgba(0,0,0,0.35);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
button, input, select, textarea { font-family: inherit; }

/* ── APP SHELL ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-brand {
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand h1 {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.sidebar-brand p {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: 0.02em;
}

/* Section tabs */
.section-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.section-tab {
  flex: 1;
  padding: 10px 8px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 150ms ease;
}
.section-tab:hover { color: var(--text-sec); background: var(--surface-alt); }
.section-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--accent-soft);
}

.sidebar-search {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border-light);
}
.sidebar-search input {
  width: 100%;
  padding: 7px 10px 7px 30px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 150ms ease;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--text-dim); }
.search-wrap { position: relative; }
.search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 13px;
  pointer-events: none;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
}
.nav-group { padding: 0 6px; margin-bottom: 1px; }
.nav-group-label {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  padding: 6px 8px 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-sec);
  transition: all 120ms ease;
  user-select: none;
}
.nav-item:hover { background: var(--surface-alt); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-badge {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  background: var(--surface-alt);
  padding: 1px 6px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.nav-code {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 400;
}
.nav-item.active .nav-badge { background: var(--accent); color: #fff; }
.nav-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nav-sub { padding-left: 20px; }
.nav-sub .nav-item { font-size: 12px; padding: 4px 8px; }

.sidebar-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sidebar-footer button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
}
.sidebar-footer button:hover { text-decoration: underline; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
  min-height: 50px;
}
.topbar-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-right: auto;
}
.topbar-crumb {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: 8px;
  font-weight: 400;
}
.stat-pills { display: flex; gap: 8px; margin-right: 6px; }
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
.pill-ok { background: var(--green-bg); color: var(--green); }
.pill-warn { background: var(--amber-bg); color: var(--amber); }
.pill-bad { background: var(--red-bg); color: var(--red); }
.pill-note { background: var(--purple-bg); color: var(--purple); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-alt); border-color: var(--text-dim); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: var(--red-bg); border-color: var(--red); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-mobile-menu { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }

/* ── CONTENT ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}

/* ── DASHBOARD ── */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.dash-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-s);
}
.dash-card-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.dash-card-value {
  font-family: var(--sans);
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.dash-card-value.ok { color: var(--green); }
.dash-card-value.warn { color: var(--amber); }
.dash-card-value.bad { color: var(--red); }
.dash-card-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}

.dash-section-title {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text-sec);
}

.dash-locations {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}
.dash-loc {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 120ms ease;
  box-shadow: var(--shadow-s);
}
.dash-loc:hover { border-color: var(--accent); background: var(--accent-soft); }
.dash-loc-icon { font-size: 22px; flex-shrink: 0; }
.dash-loc-info { min-width: 0; flex: 1; }
.dash-loc-name {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dash-loc-count { font-size: 11px; color: var(--text-dim); }
.dash-loc-bar {
  height: 4px;
  background: var(--border-light);
  border-radius: 2px;
  margin-top: 5px;
  overflow: hidden;
  display: flex;
}
.dash-loc-bar span { height: 100%; }
.bar-ok { background: var(--green); }
.bar-warn { background: var(--amber); }
.bar-bad { background: var(--red); }

/* ── TABLE ── */
.filter-bar { display: flex; gap: 6px; padding-bottom: 12px; flex-wrap: wrap; }
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sec);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms ease;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.tbl-wrap {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-s);
}
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { position: sticky; top: 0; z-index: 2; }
th {
  background: var(--surface-alt);
  padding: 9px 12px;
  text-align: left;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-sec);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-alt); }

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.st-presente { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bdr); }
.st-desgastado { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bdr); }
.st-posible-faltante, .st-faltante, .st-dañado { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bdr); }
.st-nota { background: var(--purple-bg); color: var(--purple); border: 1px solid transparent; }
.st-fuera { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bdr); }

.editable {
  cursor: pointer;
  border-radius: 3px;
  padding: 1px 3px;
  margin: -1px -3px;
}
.editable:hover { background: var(--accent-soft); }
.qty { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

.row-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 120ms; }
tr:hover .row-actions { opacity: 1; }
.row-act {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 4px;
  font-size: 13px;
}
.row-act:hover { background: var(--surface-alt); color: var(--text); }
.row-act.del:hover { background: var(--red-bg); color: var(--red); }

/* ── EMPTY STATE ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-dim);
  text-align: center;
}
.empty h3 {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-sec);
  margin: 12px 0 4px;
}
.empty p { font-size: 13px; max-width: 280px; }

/* ── MODAL ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 14px;
}
.modal-bg[hidden] { display: none !important; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-m);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.modal-head h2 { font-family: var(--sans); font-size: 15px; font-weight: 700; }
.modal-x {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  color: var(--text-dim); cursor: pointer;
  border-radius: var(--radius); font-size: 18px;
}
.modal-x:hover { background: var(--surface-alt); color: var(--text); }
.modal-body { padding: 18px; }
.fg { margin-bottom: 12px; }
.fg label {
  display: block;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-sec);
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.fg input, .fg select, .fg textarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 120ms;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--accent); }
.fg textarea { resize: vertical; min-height: 50px; }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--text);
  color: var(--bg);
  padding: 9px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-m);
  z-index: 200;
  transform: translateY(60px);
  opacity: 0;
  transition: all 250ms ease;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 90; transition: left 200ms ease; width: 280px; }
  .sidebar.open { left: 0; }
  .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 89; }
  .mobile-overlay[hidden] { display: none !important; }
  .btn-mobile-menu { display: block; }
  .topbar { padding: 8px 12px; }
  .content { padding: 12px; }
  .stat-pills { display: none; }
  .fg-row { grid-template-columns: 1fr; }
  .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ── LOGIN OVERLAY ── */
.login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-overlay[hidden] { display: none !important; }
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-m);
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-box h2 {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}
.login-box .login-sub {
  font-size: 13px;
  color: var(--text-sec);
  margin-bottom: 20px;
}
.login-box .login-icon {
  font-size: 40px;
  margin-bottom: 12px;
}
.login-box input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 15px;
  text-align: center;
  outline: none;
  margin-bottom: 14px;
  letter-spacing: 2px;
  transition: border-color 150ms;
}
.login-box input:focus { border-color: var(--accent); }
.login-box .login-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms;
}
.login-box .login-btn:hover { background: var(--accent-hover); }
.login-box .login-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 8px;

<script>
// ═══════════════════════════════════════
//  DATA STRUCTURES
// ═══════════════════════════════════════

const EQUIPOS_MODULES = ["Acústica","Calorimetría — Bandeja 1","Calorimetría — Bandeja 2","Mecánica","Ondas","Electrónica II","Mesa de Fuerzas","Óptica","Electricidad y Magnetismo"];

];

const MATERIALES_LOCATIONS = [
  { id: "Escritorio", name: "Escritorio", icon: "🗄", drawers: ["Cajón 1","Cajón 2","Cajón 3","Cajón 4","Cajón 5","Cajón 6","Cajón 7","Cajón 8","Cajón 9","Cajón 10","Cajón 11","Cajón 12"] },
  { id: "Armario Gris", name: "Armario Gris", icon: "🗃", drawers: ["Piso 1","Piso 2","Piso 3","Piso 4","Piso 5"] },
  { id: "Materiales por fuera", name: "Materiales por fuera", icon: "📋", drawers: ["Mesa de laboratorio"] },
];

const STATUSES = ["Presente","Desgastado","Posible faltante","Dañado","Nota","Faltante","Fuera"];
const STATUS_CLS = {
  "Presente":"st-presente","Desgastado":"st-desgastado",
  "Posible faltante":"st-posible-faltante","Dañado":"st-dañado",
  "Nota":"st-nota","Faltante":"st-faltante","Fuera":"st-fuera"
};

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let section = "materiales"; // "materiales" | "equipos"
let items = [];
let nextId = 1;
let currentLoc = null;
let currentDrawer = null;
let currentFilter = null;
let viewMode = "dashboard"; // "dashboard" | "list"
let locCodes = {}; // { "Kit F": "INV-12345", ... } códigos de inventario por ubicación
let customMaterialesLocs = [];
let customEquiposLocs = [];
let drawerNotes = {}; // { "Kit A::Mesa de Fuerzas": "Cerradura dañada", ... }
let currentLocFilter = null;   // combined filter: location (used during search)
let currentDrawerFilter = null; // combined filter: drawer (used during search)

// ═══════════════════════════════════════
//  USER ROLES
// ═══════════════════════════════════════
let userRole = null;     // "editor" | "lector"
let userName = null;     // nombre del lector logueado
let loginTabMode = "editor"; // current login tab
let solicitudes = [];    // loan requests array (from Firestore)

// ═══════════════════════════════════════
//  FIREBASE CONFIG
// ═══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBftjnuVvS6m5FviOQp9fxTlT6fYdr48Tw",
  authDomain: "inventario-lab-fisica.firebaseapp.com",
  projectId: "inventario-lab-fisica",
  storageBucket: "inventario-lab-fisica.firebasestorage.app",
  messagingSenderId: "841319727634",
  appId: "1:841319727634:web:c2922e036803168cec0ecb"
};

let db = null;
let firestoreReady = false;
let firestoreUnsubscribe = null;
let savingToFirestore = false;
let ignoreNextSnapshot = false;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firestoreReady = true;
  // Enable offline persistence for Firestore
  db.enablePersistence({ synchronizeTabs: true }).catch(err => {
    console.log("Firestore persistence:", err.code);
  });
} catch(e) {
  console.warn("Firebase init failed, using localStorage only:", e);
}

function showSyncStatus(msg, color) {
  const el = document.getElementById("syncIndicator");
  if (!el) return;
  el.style.display = "inline-flex";
  el.style.background = color === "ok" ? "var(--green-bg)" : color === "err" ? "var(--red-bg)" : "var(--amber-bg)";
  el.style.color = color === "ok" ? "var(--green)" : color === "err" ? "var(--red)" : "var(--amber)";
  el.textContent = msg;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = "none"; }, 3000);
}

// ═══════════════════════════════════════
//  STORAGE (LocalStorage + Firestore)
// ═══════════════════════════════════════
function storageGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

function saveData() {
  // Always save to localStorage (offline cache)
  storageSet("inv_items", items);
  storageSet("inv_nextId", nextId);
  storageSet("inv_locCodes", locCodes);
  storageSet("inv_customMatLocs", customMaterialesLocs);
  storageSet("inv_customEqLocs", customEquiposLocs);
  storageSet("inv_drawerNotes", drawerNotes);

  // Save to Firestore if available
  if (firestoreReady && db) {
    savingToFirestore = true;
    ignoreNextSnapshot = true;
    const dataDoc = {
      items: items,
      nextId: nextId,
      locCodes: locCodes,
      customMaterialesLocs: customMaterialesLocs,
      customEquiposLocs: customEquiposLocs,
      drawerNotes: drawerNotes,
      dataVersion: parseInt(storageGet("inv_dataVersion")) || 12,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: navigator.userAgent.substring(0, 50)
    };
    db.collection("inventario").doc("data").set(dataDoc).then(() => {
      savingToFirestore = false;
      showSyncStatus("☁️ Sincronizado", "ok");
    }).catch(err => {
      savingToFirestore = false;
      console.warn("Firestore save error:", err);
      showSyncStatus("⚠️ Solo local", "err");
    });
  }
}

function applyLocalData(saved) {
  if (saved && saved.length > 0) {
    items = saved;
    // Migration v9: assign sections, remove old EQ-/Ref- items
    items = items.filter(i => {
      if (!i.location) return true;
      if (i.location.startsWith("EQ-") || i.location.startsWith("Ref-")) return false;
      return true;
    });
    items.forEach(i => {
      if (i.location && ["Kit A","Kit B","Kit C","Kit D","Kit E","Kit F"].includes(i.location)) {
        i.section = "equipos";
      } else {
        i.section = "materiales";
      }
    });
    nextId = storageGet("inv_nextId") || (Math.max(...items.map(i => parseInt(i.id)||0)) + 1);
    const eqCount = items.filter(i => i.section === "equipos").length;
    if (eqCount === 0) loadDefaultEquipos();
    const dataVer = storageGet("inv_dataVersion") || 0;
    if (dataVer < 10) {
      const materiales = items.filter(i => i.section === "materiales");
      items = materiales;
      loadDefaultEquipos();
      storageSet("inv_dataVersion", 10);
    }
    applyPhotoFindings();
    // Migration v11: Replace Mesa de Fuerzas items with correct ABC manual data
    const dataVer2 = storageGet("inv_dataVersion") || 0;
    if (dataVer2 < 11) {
      migrateMesaFuerzas();
      storageSet("inv_dataVersion", 11);
    }
    // Migration v12: Replace Calorimetría items with correct ABC manual data (2 bandejas)
    const dataVer3 = storageGet("inv_dataVersion") || 0;
    if (dataVer3 < 12) {
      migrateCalorimetria();
      storageSet("inv_dataVersion", 12);
    }
  } else {
    loadDefaultMateriales();
    loadDefaultEquipos();
    storageSet("inv_dataVersion", 12);
  }
}

// Migration v11: Replace ONLY Mesa de Fuerzas items in all kits
// Preserves all other modules' states and all materiales data
function migrateMesaFuerzas() {
  const kits = ["Kit A","Kit B","Kit C","Kit D","Kit E","Kit F"];
  // Remove all existing Mesa de Fuerzas items
  items = items.filter(i => !(i.section === "equipos" && kits.includes(i.location) && i.drawer === "Mesa de Fuerzas"));
  // Recalculate nextId before generating new items
  nextId = Math.max(0, ...items.map(i => parseInt(i.id)||0)) + 1;
  // Generate correct Mesa de Fuerzas items per ABC manual
  kits.forEach(kit => {
    const mfItems = getMesaFuerzasItems(kit);
    items.push(...mfItems);
  });
  console.log("Migration v11: Mesa de Fuerzas items replaced with ABC manual data (" + kits.length + " kits × 15 items)");
}

// Migration v12: Replace Calorimetría items with correct ABC manual data, split into 2 bandejas
function migrateCalorimetria() {
  const kits = ["Kit A","Kit B","Kit C","Kit D","Kit E","Kit F"];
  // Remove all existing Calorimetría items (old single-drawer format)
  items = items.filter(i => !(i.section === "equipos" && kits.includes(i.location) && (i.drawer === "Calorimetría" || i.drawer === "Calorimetría — Bandeja 1" || i.drawer === "Calorimetría — Bandeja 2")));
  nextId = Math.max(0, ...items.map(i => parseInt(i.id)||0)) + 1;
  kits.forEach(kit => {
    const calItems = getCalorimetriaItems(kit);
    items.push(...calItems);
  });
  console.log("Migration v12: Calorimetría items replaced with ABC manual data, 2 bandejas (" + kits.length + " kits × 39 items)");
}

function getCalorimetriaItems(kit) {
  const cb1 = "Calorimetría — Bandeja 1";
  const cb2 = "Calorimetría — Bandeja 2";
  const base = [];
  let id = nextId || (Math.max(0, ...items.map(i => parseInt(i.id)||0)) + 1);
  function add(drawer, num, name, brand, qty, status, obs) {
    base.push({id:String(id++), name:name, brand:brand, quantity:qty, status:status, observations:obs, section:"equipos", location:kit, drawer:drawer, num:num});
    nextId = id;
  }
  // Bandeja 1: instrumentos y aparatos principales
  add(cb1,1,"Agitador de vidrio","ABC",1,"Presente","");
  add(cb1,2,"Anillo y bola de Gravesande","ABC",1,"Presente","");
  add(cb1,3,"Aparato de Ingenhousz","ABC",1,"Presente","");

  add(cb1,7,"Calorímetro de Joule","ABC",1,"Presente","");
  add(cb1,8,"Dilatómetro de metales (pirómetro)","ABC",1,"Presente","");
  add(cb1,9,"Erlenmeyer","ABC",1,"Presente","");
  add(cb1,10,"Escala centimétrica","ABC",1,"Presente","");
  add(cb1,11,"Cilindros de aluminio de 25 g","ABC",2,"Presente","");
  add(cb1,12,"Cilindros de cobre de 25 g","ABC",2,"Presente","");
  add(cb1,13,"Mechero de alcohol","ABC",1,"Presente","");
  add(cb1,14,"Pulsómetro de Franklin","ABC",1,"Presente","");
  add(cb1,15,"Refrigerante recto de Liebig de 200 mm","ABC",1,"Presente","");
  add(cb1,16,"Soporte metálico triangular, varilla de 70 cm","ABC",1,"Presente","");
  add(cb1,17,"Trípode en hierro","ABC",1,"Presente","");
  add(cb1,18,"Vaso de precipitado","ABC",1,"Presente","");
  add(cb1,19,"Azul de metileno indic. color. frasco x 25 g","ABC",1,"Presente","");
  add(cb1,20,"Parafina sólida en trozos de 100 g","ABC",1,"Presente","");
  // Bandeja 2: accesorios, pinzas, tapones, mangueras

function loadData() {
  // Step 1: Load from localStorage immediately (fast, offline-ready)
  const saved = storageGet("inv_items");
  applyLocalData(saved);
  const savedCodes = storageGet("inv_locCodes");
  if (savedCodes) locCodes = savedCodes;
  const savedMatLocs = storageGet("inv_customMatLocs");
  if (savedMatLocs) customMaterialesLocs = savedMatLocs;
  const savedEqLocs = storageGet("inv_customEqLocs");
  if (savedEqLocs) customEquiposLocs = savedEqLocs;
  const savedDrNotes = storageGet("inv_drawerNotes");
  if (savedDrNotes) drawerNotes = savedDrNotes;

  // Step 2: If Firestore is available, fetch latest data and set up real-time listener
  if (firestoreReady && db) {
    showSyncStatus("☁️ Conectando...", "warn");
    // Initial fetch
    db.collection("inventario").doc("data").get().then(doc => {
      if (doc.exists) {
        const d = doc.data();
        items = d.items || [];
        nextId = d.nextId || (Math.max(...items.map(i => parseInt(i.id)||0)) + 1);
        locCodes = d.locCodes || {};
        customMaterialesLocs = d.customMaterialesLocs || [];
        customEquiposLocs = d.customEquiposLocs || [];
        drawerNotes = d.drawerNotes || {};
        // Migration v11: fix Mesa de Fuerzas in Firestore data too
        const fsVer = d.dataVersion || 0;
        if (fsVer < 11) {
          migrateMesaFuerzas();
        }
        // Migration v12: fix Calorimetría in Firestore data too (2 bandejas)
        if (fsVer < 12) {
          migrateCalorimetria();
          saveData(); // Push corrected data back to Firestore
          db.collection("inventario").doc("data").update({ dataVersion: 12 }).catch(()=>{});
          storageSet("inv_dataVersion", 12);
        }
        // Update localStorage cache
        storageSet("inv_items", items);
        storageSet("inv_nextId", nextId);
        storageSet("inv_locCodes", locCodes);
        storageSet("inv_customMatLocs", customMaterialesLocs);
        storageSet("inv_customEqLocs", customEquiposLocs);
        storageSet("inv_drawerNotes", drawerNotes);
        render();
        showSyncStatus("☁️ Sincronizado", "ok");
      } else {
        // No data in Firestore yet, push local data up
        saveData();
        showSyncStatus("☁️ Datos subidos", "ok");
      }
    }).catch(err => {
      console.warn("Firestore initial load error:", err);
      showSyncStatus("⚠️ Modo offline", "err");
    });

    // Real-time listener for changes from other devices
    setupRealtimeSync();
  }

  // Save to localStorage (for first-time defaults)
  storageSet("inv_items", items);
  storageSet("inv_nextId", nextId);
}

function setupRealtimeSync() {
  if (!firestoreReady || !db) return;
  if (firestoreUnsubscribe) firestoreUnsubscribe(); // cleanup previous

  firestoreUnsubscribe = db.collection("inventario").doc("data").onSnapshot(doc => {
    if (!doc.exists) return;
    // Skip if we just saved (avoid re-render loop)
    if (ignoreNextSnapshot) {
      ignoreNextSnapshot = false;
      return;
    }
    const d = doc.data();
    if (!d.items) return;

    items = d.items;
    nextId = d.nextId || nextId;
    locCodes = d.locCodes || {};
    customMaterialesLocs = d.customMaterialesLocs || [];
    customEquiposLocs = d.customEquiposLocs || [];
    drawerNotes = d.drawerNotes || {};
    // Update localStorage cache
    storageSet("inv_items", items);
    storageSet("inv_nextId", nextId);
    storageSet("inv_locCodes", locCodes);
    storageSet("inv_customMatLocs", customMaterialesLocs);
    storageSet("inv_customEqLocs", customEquiposLocs);
    storageSet("inv_drawerNotes", drawerNotes);
    render();
    showSyncStatus("🔄 Actualizado", "ok");
  }, err => {
    console.warn("Firestore listener error:", err);
  });
}

function applyPhotoFindings() {
  // Helper: find item by kit, module, and item number, then update status + obs
  function mark(kit, mod, num, status, obs) {
    const it = items.find(i => i.section==="equipos" && i.location===kit && i.drawer===mod && i.num===num);
    if (it) { it.status = status; if (obs) it.observations = obs; }
  }

  const allKits = ["Kit A","Kit B","Kit C","Kit D","Kit E","Kit F"];
  const em = "Electricidad y Magnetismo";
  const ond = "Ondas";
  const mf = "Mesa de Fuerzas";
  const mec = "Mecánica";
  const op = "Óptica";

  // ══ ELECTRICIDAD Y MAGNETISMO — Todos los kits ══
  // Cajones consistentemente semivacíos. Solo visibles: fuente, trípodes, cables, imanes barra.
  allKits.forEach(kit => {
    mark(kit,em,7,"Faltante","No visible en revisión fotográfica");  // Brújula
    mark(kit,em,8,"Faltante","No visible en revisión fotográfica");  // Electroimán
    mark(kit,em,9,"Faltante","No visible en revisión fotográfica");  // Galvanómetro
    mark(kit,em,10,"Faltante","No visible en revisión fotográfica"); // Interruptor
    mark(kit,em,11,"Faltante","No visible en revisión fotográfica"); // Bombillos juego
    mark(kit,em,12,"Faltante","No visible en revisión fotográfica"); // Resistencias
    mark(kit,em,13,"Faltante","No visible en revisión fotográfica"); // Condensadores
    mark(kit,em,14,"Faltante","No visible en revisión fotográfica"); // Imanes herradura
    mark(kit,em,15,"Faltante","No visible en revisión fotográfica"); // Núcleo hierro dulce
    mark(kit,em,16,"Faltante","No visible en revisión fotográfica"); // Barras electrostática
    mark(kit,em,17,"Faltante","No visible en revisión fotográfica"); // Paños frotamiento
  });

  // ══ CUBETA DE ONDAS — Todos los kits ══
  // Consistentemente faltan la mayoría de accesorios
  allKits.forEach(kit => {
    mark(kit,ond,8,"Faltante","No visible en revisión fotográfica");  // Manual
    mark(kit,ond,9,"Faltante","No visible en revisión fotográfica");  // Estuche
    mark(kit,ond,11,"Faltante","No visible en revisión fotográfica"); // Generador ondas
    mark(kit,ond,12,"Faltante","No visible en revisión fotográfica"); // Lámina vidrio
    mark(kit,ond,13,"Faltante","No visible en revisión fotográfica"); // Pantalla reflexión
    mark(kit,ond,14,"Faltante","No visible en revisión fotográfica"); // Peine difracción
    mark(kit,ond,15,"Faltante","No visible en revisión fotográfica"); // Rendija simple/doble
    mark(kit,ond,16,"Faltante","No visible en revisión fotográfica"); // Superficie absorción
    mark(kit,ond,18,"Faltante","No visible en revisión fotográfica"); // Barrera vidrio plana
    mark(kit,ond,19,"Faltante","No visible en revisión fotográfica"); // Varilla agitación
    mark(kit,ond,20,"Faltante","No visible en revisión fotográfica"); // Nivel burbuja
    mark(kit,ond,21,"Faltante","No visible en revisión fotográfica"); // Bombilla estroboscopio
    mark(kit,ond,22,"Faltante","No visible en revisión fotográfica"); // Espejo plano
  });
  // Fuente vibradora: faltante en F, A, C
  ["Kit F","Kit A","Kit C"].forEach(kit => {
    mark(kit,ond,10,"Faltante","No visible en revisión fotográfica");
  });
  // Disco estroboscópico: faltante en A, B
  ["Kit A","Kit B"].forEach(kit => {
    mark(kit,ond,5,"Faltante","No visible en revisión fotográfica");
  });
  // Superficie parabólica: faltante en todos excepto D
  ["Kit A","Kit B","Kit C","Kit E","Kit F"].forEach(kit => {
    mark(kit,ond,17,"Faltante","No visible en revisión fotográfica");
  });

  // ══ MESA DE FUERZAS ══
  // (Datos corregidos en migración v11 con ítems del manual oficial ABC.

  // ══ MECÁNICA — Kit C ══

  mark("Kit C",mec,10,"Faltante","No visible en revisión fotográfica — faltante significativo");

function getLocs() {
  if (section === "equipos") return [...EQUIPOS_LOCATIONS, ...customEquiposLocs];
  return [...MATERIALES_LOCATIONS, ...customMaterialesLocs];
}
function isCustomLoc(locId) {
  return customMaterialesLocs.some(l=>l.id===locId) || customEquiposLocs.some(l=>l.id===locId);
}
function sectionItems() { return items.filter(i => i.section === section); }

function switchSection(s) {
  section = s;
  viewMode = "dashboard";
  currentLoc = null;
  currentDrawer = null;
  currentFilter = null;
  document.getElementById("searchInput").value = "";
  render();
}

function renderSidebar() {
  const nav = document.getElementById("sidebarNav");
  const locs = getLocs();
  const si = sectionItems();

  // Section tabs
  document.getElementById("tabMateriales").classList.toggle("active", section==="materiales");
  document.getElementById("tabEquipos").classList.toggle("active", section==="equipos");



  let html = '';
  // Dashboard link
  const dashActive = viewMode === "dashboard";
  html += `<div class="nav-group"><div class="nav-item${dashActive?' active':''}" onclick="goToDashboard()">
    <span>&#x1F4CA;</span><span>Resumen</span><span class="nav-badge">${si.length}</span>
  </div></div>`;

  locs.forEach(loc => {
    const count = si.filter(i => i.location === loc.id).length;
    const isActive = currentLoc === loc.id && !currentDrawer && (viewMode==="list" || viewMode==="drawers");
    html += `<div class="nav-group">`;
    const isCustom = isCustomLoc(loc.id);
    html += `<div class="nav-item${isActive?' active':''}" onclick="goToLoc('${esc(loc.id)}')">
      <span>${loc.icon}</span><span>${esc(loc.name)}${locCodes[loc.id]?'<span class="nav-code">'+esc(locCodes[loc.id])+'</span>':''}</span>
      ${isCustom?`<span class="loc-actions"><button class="loc-act-btn" onclick="event.stopPropagation();openLocModal('${esc(loc.id)}')" title="Editar">✎</button><button class="loc-act-btn del" onclick="event.stopPropagation();deleteLoc('${esc(loc.id)}')" title="Eliminar">✕</button></span>`:''}
      <span class="nav-badge">${count}</span>
    </div>`;
    if (currentLoc === loc.id && (viewMode==="list" || viewMode==="drawers")) {
      html += `<div class="nav-sub">`;
      loc.drawers.forEach(d => {
        const dCount = si.filter(i => i.location === loc.id && i.drawer === d).length;
        const isActiveD = currentDrawer === d;
        const hasIssue = si.some(i => i.location === loc.id && i.drawer === d && ["Posible faltante","Dañado","Faltante"].includes(i.status));
        html += `<div class="nav-item${isActiveD?' active':''}" onclick="goToDrawer('${esc(loc.id)}','${esc(d)}')">
          <span class="nav-dot" style="background:${hasIssue?'var(--red)':'var(--green)'}"></span>
          <span>${esc(d.split(' ')[0])}</span>
          <span class="nav-badge">${dCount}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Botón para agregar nueva ubicación (solo editor)
  if (userRole === "editor") html += `<div class="loc-mgmt-btn" onclick="openLocModal()">+ Nueva ubicación</div>`;

  nav.innerHTML = html;

  // Footer
  document.getElementById("footerCount").textContent = `${si.length} ítems`;
}

function renderTopbar() {
  const tb = document.getElementById("topbar");
  const isEditor = userRole === "editor";

  // Special views
  if (viewMode === "users") {
    tb.innerHTML = `<button class="btn-mobile-menu" onclick="toggleMobile()">&#9776;</button>
      <span class="topbar-title">👥 Gestión de Usuarios</span>
      <button class="btn btn-sm" onclick="goToDashboard()">← Inventario</button>`;
    return;
  }
  if (viewMode === "solicitudes" || viewMode === "mis-solicitudes") {
    tb.innerHTML = `<button class="btn-mobile-menu" onclick="toggleMobile()">&#9776;</button>
      <span class="topbar-title">📋 ${viewMode==="solicitudes"?"Solicitudes de Préstamo":"Mis Solicitudes"}</span>
      <button class="btn btn-sm" onclick="goToDashboard()">← Inventario</button>`;
    return;
  }

  let titleHtml = '';
  if (viewMode === "dashboard") {
    titleHtml = section === "equipos" ? "Equipos — Referencia ABC" : "Materiales — Inventario";
  } else if (viewMode === "drawers") {
    const locObj = getLocs().find(l => l.id === currentLoc);
    titleHtml = locObj ? esc(locObj.name) : esc(currentLoc || '');
    if (isEditor) titleHtml += `<span class="topbar-crumb">Inventario${locCodes[currentLoc]?' · '+esc(locCodes[currentLoc]):''}</span> <button class="btn btn-sm" onclick="editLocCode('${esc(currentLoc)}')" style="font-size:11px;padding:2px 8px">Código inv.</button>`;
    else titleHtml += locCodes[currentLoc] ? `<span class="topbar-crumb">${esc(locCodes[currentLoc])}</span>` : '';
  } else {
    titleHtml = currentDrawer ? esc(currentDrawer) : esc(currentLoc || '');
    if (currentLoc && !currentDrawer) {
      if (isEditor) titleHtml += `<span class="topbar-crumb">Inventario${locCodes[currentLoc]?' · '+esc(locCodes[currentLoc]):''}</span> <button class="btn btn-sm" onclick="editLocCode('${esc(currentLoc)}')" style="font-size:11px;padding:2px 8px">Código inv.</button>`;
      else titleHtml += locCodes[currentLoc] ? `<span class="topbar-crumb">${esc(locCodes[currentLoc])}</span>` : '';
    } else if (currentDrawer) {
      titleHtml += `<span class="topbar-crumb">${esc(currentLoc)}</span>`;
      const noteKey = currentLoc + "::" + currentDrawer;
      const dn = drawerNotes[noteKey];
      if (dn) titleHtml += `<span style="font-size:11px;color:var(--amber);margin-left:8px">⚠ ${esc(dn)}</span>`;
    }
  }

  let filtered;
  if (viewMode === "list") filtered = getFiltered();
  else if (viewMode === "drawers") filtered = sectionItems().filter(i => i.location === currentLoc);
  else filtered = sectionItems();
  const pres = filtered.filter(i=>i.status==="Presente").length;
  const desg = filtered.filter(i=>i.status==="Desgastado").length;
  const bad = filtered.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;

  tb.innerHTML = `
    <button class="btn-mobile-menu" onclick="toggleMobile()">&#9776;</button>
    <span class="topbar-title" id="topTitle">${titleHtml}</span>
    <div class="stat-pills">
      <span class="stat-pill pill-ok">${pres} OK</span>
      ${desg?`<span class="stat-pill pill-warn">${desg}</span>`:''}
      ${bad?`<span class="stat-pill pill-bad">${bad}</span>`:''}
    </div>
    ${isEditor?`<button class="btn btn-accent btn-sm" onclick="openAddModal()">+ Agregar</button>`:''}
    ${isEditor?`<button class="btn btn-sm" onclick="exportCSV()">CSV</button>`:''}
    ${isEditor&&currentLoc&&currentDrawer?`<button class="btn btn-sm" onclick="editDrawerNote('${esc(currentLoc)}','${esc(currentDrawer)}')">📝 Nota</button>`:''}
    ${viewMode!=="dashboard"?`<button class="btn btn-sm" onclick="goToDashboard()">Resumen</button>`:''}
  `;
}

function renderContent() {
  const el = document.getElementById("content");
  if (viewMode === "users") { renderUsersPanel(); return; }
  if (viewMode === "solicitudes" || viewMode === "mis-solicitudes") { renderSolicitudesPanel(); return; }
  if (viewMode === "dashboard") {
    renderDashboard(el);
  } else if (viewMode === "drawers") {
    renderDrawersView(el);
  } else {
    renderTable(el);
  }
}

function renderDrawersView(el) {
  const loc = getLocs().find(l => l.id === currentLoc);
  if (!loc) { renderDashboard(el); return; }
  const si = sectionItems().filter(i => i.location === currentLoc);
  const total = si.length;
  const pres = si.filter(i=>i.status==="Presente").length;
  const desg = si.filter(i=>i.status==="Desgastado").length;
  const bad = si.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;

  let html = `<div class="dashboard-grid" style="margin-bottom:20px">
    <div class="dash-card"><div class="dash-card-label">Total ítems</div><div class="dash-card-value">${total}</div></div>
    <div class="dash-card"><div class="dash-card-label">Presente</div><div class="dash-card-value ok">${pres}</div></div>
    ${desg?`<div class="dash-card"><div class="dash-card-label">Desgastado</div><div class="dash-card-value warn">${desg}</div></div>`:''}
    ${bad?`<div class="dash-card"><div class="dash-card-label">Faltante / Dañado</div><div class="dash-card-value bad">${bad}</div></div>`:''}
  </div>`;

  html += `<div class="dash-section-title">${loc.drawers[0]?.startsWith("Piso")||loc.drawers[0]?.startsWith("Cajón")? "Pisos / Cajones" : section==="equipos" ? "Módulos" : "Secciones"} (${loc.drawers.length})</div>`;
  html += `<div class="dash-locations">`;
  loc.drawers.forEach(d => {
    const di = si.filter(i => i.drawer === d);
    const ct = di.length;
    const okC = di.filter(i=>i.status==="Presente").length;
    const warnC = di.filter(i=>i.status==="Desgastado").length;
    const badC = di.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;
    const okP = ct ? (okC/ct*100) : 0;
    const warnP = ct ? (warnC/ct*100) : 0;
    const badP = ct ? (badC/ct*100) : 0;
    const icon = section==="equipos" ? "📋" : d.startsWith("Piso")?"📂":"🗂";
    const noteKey = currentLoc + "::" + d;
    const note = drawerNotes[noteKey] || "";
    html += `<div class="dash-loc" onclick="goToDrawer('${esc(currentLoc)}','${esc(d)}')">
      <span class="dash-loc-icon">${icon}</span>
      <div class="dash-loc-info">
        <div class="dash-loc-name">${esc(d)}</div>
        <div class="dash-loc-count">${ct} ítems</div>
        ${note?`<div style="font-size:11px;color:var(--amber);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(note)}">⚠ ${esc(note)}</div>`:''}
        ${ct?`<div class="dash-loc-bar">
          <span class="bar-ok" style="width:${okP}%"></span>
          <span class="bar-warn" style="width:${warnP}%"></span>
          <span class="bar-bad" style="width:${badP}%"></span>
        </div>`:''}
      </div>
      ${userRole==="editor"?`<button class="loc-act-btn" onclick="event.stopPropagation();editDrawerNote('${esc(currentLoc)}','${esc(d)}')" title="Nota del módulo" style="opacity:0.5;font-size:14px">📝</button>`:''}
    </div>`;
  });
  html += `</div>`;

  // Items needing attention in this location
  const attention = si.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status));
  if (attention.length) {
    html += `<div class="dash-section-title" style="margin-top:20px">Requieren atención (${attention.length})</div>`;
    html += `<div class="tbl-wrap"><div class="tbl-scroll"><table>
      <thead><tr><th>${section==="equipos"?"Módulo":"Cajón"}</th><th>N.°</th><th>Material</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody>`;
    attention.forEach(i => {
      html += `<tr style="cursor:pointer" onclick="goToDrawer('${esc(i.location)}','${esc(i.drawer)}')">
        <td style="font-family:var(--mono);font-size:12px">${esc(i.drawer)}</td>
        <td class="qty">${i.num}</td>
        <td>${esc(i.name)}</td>
        <td><span class="status-tag ${STATUS_CLS[i.status]||''}">${esc(i.status)}</span></td>
        <td style="font-size:12px;color:var(--text-sec)">${esc(i.observations)}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  el.innerHTML = html;
}

function renderDashboard(el) {
  const si = sectionItems();
  const total = si.length;
  const pres = si.filter(i=>i.status==="Presente").length;
  const desg = si.filter(i=>i.status==="Desgastado").length;
  const falt = si.filter(i=>["Posible faltante","Faltante"].includes(i.status)).length;
  const dan = si.filter(i=>i.status==="Dañado").length;
  const fuera = si.filter(i=>i.status==="Fuera").length;
  const nota = si.filter(i=>i.status==="Nota").length;

  let html = `<div class="dashboard-grid">
    <div class="dash-card"><div class="dash-card-label">Total registrado</div><div class="dash-card-value">${total}</div><div class="dash-card-sub">ítems del laboratorio</div></div>
    <div class="dash-card"><div class="dash-card-label">Presente</div><div class="dash-card-value ok">${pres}</div><div class="dash-card-sub">${total?Math.round(pres/total*100):0}% del total</div></div>
    <div class="dash-card"><div class="dash-card-label">Desgastado</div><div class="dash-card-value warn">${desg}</div><div class="dash-card-sub">requieren atención</div></div>
    <div class="dash-card"><div class="dash-card-label">Faltante / Dañado</div><div class="dash-card-value bad">${falt+dan}</div><div class="dash-card-sub">${falt} posibles faltantes (huecos vacíos en espuma), ${dan} dañados</div></div>
  </div>`;

  if (fuera > 0 || nota > 0) {
    html += `<div class="dashboard-grid" style="margin-bottom:24px">`;
    if (fuera) html += `<div class="dash-card"><div class="dash-card-label">Fuera de kit</div><div class="dash-card-value" style="color:var(--amber)">${fuera}</div></div>`;
    if (nota) html += `<div class="dash-card"><div class="dash-card-label">Notas</div><div class="dash-card-value" style="color:var(--purple)">${nota}</div></div>`;
    html += `</div>`;
  }

  html += `<div class="dash-section-title">Ubicaciones</div><div class="dash-locations">`;
  const locs = getLocs();
  locs.forEach(loc => {
    const li = si.filter(i=>i.location===loc.id);
    const ct = li.length;
    const okC = li.filter(i=>i.status==="Presente").length;
    const warnC = li.filter(i=>i.status==="Desgastado").length;
    const badC = li.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status)).length;
    const okP = ct ? (okC/ct*100) : 0;
    const warnP = ct ? (warnC/ct*100) : 0;
    const badP = ct ? (badC/ct*100) : 0;
    const isC = isCustomLoc(loc.id);
    html += `<div class="dash-loc" onclick="goToLoc('${esc(loc.id)}')" style="position:relative">
      <span class="dash-loc-icon">${loc.icon}</span>
      <div class="dash-loc-info">
        <div class="dash-loc-name">${esc(loc.name)}${locCodes[loc.id]?' <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim);font-weight:400">'+esc(locCodes[loc.id])+'</span>':' <span style="font-size:11px;color:var(--text-dim);font-style:italic">Sin código</span>'}${isC?'<span class="loc-actions" style="display:inline-flex;vertical-align:middle;margin-left:6px"><button class="loc-act-btn" onclick="event.stopPropagation();openLocModal(\''+esc(loc.id)+'\')" title="Editar">✎</button><button class="loc-act-btn del" onclick="event.stopPropagation();deleteLoc(\''+esc(loc.id)+'\')" title="Eliminar">✕</button></span>':''}</div>
        <div class="dash-loc-count">${ct} ítems · ${loc.drawers.length} ${loc.drawers[0]?.startsWith("Piso")?"pisos":section==="equipos"?"módulos":"secciones"}</div>
        ${ct?`<div class="dash-loc-bar">
          <span class="bar-ok" style="width:${okP}%"></span>
          <span class="bar-warn" style="width:${warnP}%"></span>
          <span class="bar-bad" style="width:${badP}%"></span>
        </div>`:''}
      </div>
    </div>`;
  });
  if (userRole === "editor") {
    html += `<div class="dash-loc" onclick="openLocModal()" style="border:2px dashed var(--border);background:transparent;cursor:pointer;justify-content:center;min-height:60px">
      <span style="font-size:20px;color:var(--accent)">+</span>
      <div class="dash-loc-info">
        <div class="dash-loc-name" style="color:var(--accent)">Nueva ubicación</div>
      </div>
    </div>`;
  }
  html += `</div>`;

  // Items needing attention
  const attention = si.filter(i=>["Posible faltante","Dañado","Faltante"].includes(i.status));
  if (attention.length) {
    html += `<div class="dash-section-title">Requieren atención (${attention.length})</div>`;
    html += `<div class="tbl-wrap"><div class="tbl-scroll"><table>
      <thead><tr><th>Ubicación</th><th>Cajón</th><th>Material</th><th>Estado</th><th>Qué falta / Problema</th></tr></thead><tbody>`;
    attention.forEach(i => {
      html += `<tr style="cursor:pointer" onclick="goToDrawer('${esc(i.location)}','${esc(i.drawer)}')">
        <td>${esc(i.location)}</td>
        <td style="font-family:var(--mono);font-size:12px">${esc(i.drawer.split(' ')[0])}</td>
        <td>${esc(i.name)}</td>
        <td><span class="status-tag ${STATUS_CLS[i.status]||''}">${esc(i.status)}</span></td>
        <td style="font-size:12px;color:var(--text-sec)">${esc(i.observations)}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  el.innerHTML = html;
}

function renderTable(el) {
  const filtered = getFiltered();
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4M4 7l8 4M4 7v10l8 4m0-10v10"/></svg>
      <h3>Sin elementos</h3>
      <p>Usa "+ Agregar" para registrar el primer ítem en esta ubicación.</p>
    </div>`;
    return;
  }

  // Filter chips — status
  let chipHtml = `<div class="filter-bar">
    <span class="filter-chip${!currentFilter?' active':''}" onclick="setFilter(null)">Todos (${filtered.length})</span>`;
  STATUSES.forEach(s => {
    const c = filtered.filter(i=>i.status===s).length;
    if(c) chipHtml += `<span class="filter-chip${currentFilter===s?' active':''}" onclick="setFilter('${s}')">${s} (${c})</span>`;
  });
  chipHtml += `</div>`;

  // Additional combined filters when searching or at top level
  const isSearch = document.getElementById("searchInput").value.trim();
  if (isSearch) {
    // Show location grouping when in search results
    const locs = [...new Set(filtered.map(i=>i.location))].sort();
    if (locs.length > 1) {
      chipHtml += `<div class="filter-bar" style="padding-top:0">
        <span style="font-size:11px;color:var(--text-dim);padding:4px 4px;font-weight:600">Ubicación:</span>
        <span class="filter-chip${!currentLocFilter?' active':''}" onclick="setLocFilter(null)">Todas</span>`;
      locs.forEach(l => {
        const c = filtered.filter(i=>i.location===l).length;
        chipHtml += `<span class="filter-chip${currentLocFilter===l?' active':''}" onclick="setLocFilter('${esc(l)}')">${esc(l)} (${c})</span>`;
      });
      chipHtml += `</div>`;
    }
    // Show drawer grouping
    const baseFiltered = currentLocFilter ? filtered.filter(i=>i.location===currentLocFilter) : filtered;
    const drawers = [...new Set(baseFiltered.map(i=>i.drawer))].sort();
    if (drawers.length > 1 && currentLocFilter) {
      chipHtml += `<div class="filter-bar" style="padding-top:0">
        <span style="font-size:11px;color:var(--text-dim);padding:4px 4px;font-weight:600">Módulo:</span>
        <span class="filter-chip${!currentDrawerFilter?' active':''}" onclick="setDrawerFilter(null)">Todos</span>`;
      drawers.forEach(d => {
        const c = baseFiltered.filter(i=>i.drawer===d).length;
        chipHtml += `<span class="filter-chip${currentDrawerFilter===d?' active':''}" onclick="setDrawerFilter('${esc(d)}')">${esc(d)} (${c})</span>`;
      });
      chipHtml += `</div>`;
    }
  }

  let display = currentFilter ? filtered.filter(i=>i.status===currentFilter) : filtered;
  if (currentLocFilter) display = display.filter(i=>i.location===currentLocFilter);
  if (currentDrawerFilter) display = display.filter(i=>i.drawer===currentDrawerFilter);

  const isEditor = userRole === "editor";

  let tHtml = `<div class="tbl-wrap"><div class="tbl-scroll"><table>
    <thead><tr>
      <th style="width:36px">N.°</th>
      <th>Material / Elemento</th>
      <th>Marca</th>
      <th style="width:90px">Serial</th>
      <th style="width:55px">Cant.</th>
      <th style="width:110px">Estado</th>
      <th>Observaciones</th>
      <th style="width:${isEditor?'60':'70'}px"></th>
    </tr></thead><tbody>`;

  display.forEach(item => {
    tHtml += `<tr>
      <td class="qty">${item.num}</td>
      <td>${isEditor?`<span class="editable" onclick="editField('${item.id}','name')">`:''}${esc(item.name)}${isEditor?'</span>':''}</td>
      <td>${isEditor?`<span class="editable" onclick="editField('${item.id}','brand')">`:''}${esc(item.brand)||'—'}${isEditor?'</span>':''}</td>
      <td style="font-family:var(--mono);font-size:11px">${isEditor?`<span class="editable" onclick="editField('${item.id}','serial')">`:''}${esc(item.serial||'')||'—'}${isEditor?'</span>':''}</td>
      <td class="qty">${isEditor?`<span class="editable" onclick="editField('${item.id}','quantity')">`:''}${esc(String(item.quantity))}${isEditor?'</span>':''}</td>
      <td><span class="status-tag ${STATUS_CLS[item.status]||''}" ${isEditor?`onclick="editStatus('${item.id}', event)"`:''} style="${isEditor?'':'cursor:default'}">${esc(item.status)}</span></td>
      <td style="font-size:12px">${isEditor?`<span class="editable" onclick="editField('${item.id}','observations')">`:''}${esc(item.observations)||'—'}${isEditor?'</span>':''}</td>
      <td>${isEditor?`<div class="row-actions">
        <button class="row-act" onclick="openEditModal('${item.id}')" title="Editar">&#9998;</button>
        <button class="row-act del" onclick="deleteItem('${item.id}')" title="Eliminar">&#10005;</button>
      </div>`:`<button class="btn-request-item" onclick="requestItem('${item.id}')" title="Solicitar préstamo">📋</button>`}</td>
    </tr>`;
  });
  tHtml += `</tbody></table></div></div>`;

  el.innerHTML = chipHtml + tHtml;
}

function getFiltered() {
  const si = sectionItems();
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  if (search) {
    return si.filter(i =>
      i.name.toLowerCase().includes(search) ||
      i.brand.toLowerCase().includes(search) ||
      (i.serial||'').toLowerCase().includes(search) ||
      i.observations.toLowerCase().includes(search) ||
      i.drawer.toLowerCase().includes(search) ||
      i.location.toLowerCase().includes(search)
    ).sort((a,b)=>a.num-b.num);
  }
  let r = si;
  if (currentLoc) r = r.filter(i=>i.location===currentLoc);
  if (currentDrawer) r = r.filter(i=>i.drawer===currentDrawer);
  return r.sort((a,b)=>a.num-b.num);
}

function render() { renderSidebar(); renderTopbar(); renderContent(); updateRoleUI(); }

function updateRoleUI() {
  // Update sidebar footer based on role
  const footer = document.getElementById("sidebarFooter");
  if (!footer) return;
  const pending = solicitudes.filter(s => s.status === "pendiente").length;
  const badgeHtml = pending ? `<span class="loan-badge" id="solBadge">${pending}</span>` : '<span id="solBadge" style="display:none"></span>';

  if (userRole === "editor") {
    footer.innerHTML = `
      <span id="footerCount">${items.length} items</span>
      <button onclick="openSolicitudesPanel()">📋 Solicitudes${badgeHtml}</button>
      <button onclick="openUserManager()">👥 Usuarios</button>
      <button onclick="openChangePasswordModal()">🔑 Contraseña</button>
      <button onclick="exportCSV()">Exportar CSV</button>
      <button class="logout-btn" onclick="doLogout()" title="Cerrar sesión">🔒 Salir</button>`;
  } else if (userRole === "lector") {
    footer.innerHTML = `
      <span id="footerCount">${items.length} items · 👤 ${esc(userName)}</span>
      <button onclick="openSolicitudesPanel()">📋 Mis Solicitudes${badgeHtml}</button>
      <button class="logout-btn" onclick="doLogout()" title="Cerrar sesión">🔒 Salir</button>`;
  }
}

//  NAVIGATION
// ═══════════════════════════════════════


function goToDashboard() {
  viewMode = "dashboard";
  currentLoc = null;
  currentLocFilter = null;
  currentDrawerFilter = null;
  currentDrawer = null;
  currentFilter = null;
  render();
  closeMobile();
}

function goToLoc(loc) {
  viewMode = "drawers";
  currentLoc = loc;
  currentDrawer = null;
  currentFilter = null;
  render();
  closeMobile();
}

function goToDrawer(loc, drawer) {
  viewMode = "list";
  currentLoc = loc;
  currentDrawer = drawer;
  currentFilter = null;
  render();
  closeMobile();
}

function setFilter(f) { currentFilter = f; renderContent(); }
function setLocFilter(f) { currentLocFilter = f; currentDrawerFilter = null; renderContent(); }
function setDrawerFilter(f) { currentDrawerFilter = f; renderContent(); }

document.getElementById("searchInput").addEventListener("input", function() {
  if (this.value.trim()) { viewMode = "list"; currentLoc = null; currentDrawer = null; currentFilter = null; currentLocFilter = null; currentDrawerFilter = null; }
  else { currentLocFilter = null; currentDrawerFilter = null; }
  render();
});

// ═══════════════════════════════════════
//  INLINE EDITING
// ═══════════════════════════════════════
function editField(id, field) {
  const item = items.find(i=>i.id===id);
  if(!item) return;
  const labels = {name:"Nombre del material:",brand:"Marca:",quantity:"Cantidad:",observations:"Observaciones:"};
  const val = prompt(labels[field]||field, item[field]);
  if(val!==null){ item[field]=val; saveData(); render(); toast("Actualizado"); }
}

function editStatus(id, event) {
  const item = items.find(i=>i.id===id);
  if(!item) return;
  // Remove any existing dropdown
  closeStatusDropdown();

  const STATUS_COLORS = {
    "Presente":"var(--green)","Desgastado":"var(--amber)",
    "Posible faltante":"var(--red)","Dañado":"var(--red)",
    "Nota":"var(--purple)","Faltante":"var(--red)","Fuera":"var(--amber)"
  };

  // Create overlay to close on outside click
  const overlay = document.createElement('div');
  overlay.className = 'status-dropdown-overlay';
  overlay.onclick = closeStatusDropdown;
  document.body.appendChild(overlay);

  // Create dropdown
  const dd = document.createElement('div');
  dd.className = 'status-dropdown';
  dd.id = 'activeStatusDropdown';
  STATUSES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'status-dropdown-item' + (s === item.status ? ' selected' : '');
    btn.innerHTML = `<span class="status-dropdown-dot" style="background:${STATUS_COLORS[s]||'var(--text-dim)'}"></span>${s}${s === item.status ? ' ✓' : ''}`;
    btn.onclick = function(e) {
      e.stopPropagation();
      item.status = s;
      saveData();
      closeStatusDropdown();
      render();
      toast("Estado: " + s);
    };
    dd.appendChild(btn);
  });

  // Position near the clicked element
  const rect = event.target.closest('.status-tag').getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.left = rect.left + 'px';
  dd.style.top = (rect.bottom + 4) + 'px';
  // Ensure it doesn't go off screen
  document.body.appendChild(dd);
  const ddRect = dd.getBoundingClientRect();
  if (ddRect.right > window.innerWidth - 8) {
    dd.style.left = Math.max(8, window.innerWidth - ddRect.width - 8) + 'px';
  }
  if (ddRect.bottom > window.innerHeight - 8) {
    dd.style.top = (rect.top - ddRect.height - 4) + 'px';
  }
}

function exportCSV() {
  const si = sectionItems();
  const bom = "﻿";
  let csv = bom + "Ubicación,Código Inventario,Cajón,N.°,Material,Marca,Serial,Cantidad,Estado,Observaciones\n";
  si.forEach(i => {
    csv += [`"${i.location}"`,`"${locCodes[i.location]||""}"`,`"${i.drawer}"`,i.num,`"${i.name}"`,`"${i.brand}"`,`"${i.serial||""}"`,i.quantity,i.status,`"${i.observations}"`].join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `inventario-${section}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exportado");
}

function saveLoc(editId) {
  const name = document.getElementById('loc-name').value.trim();
  if (!name) { toast("Ingresa un nombre"); return; }
  const icon = document.getElementById('loc-icon').value;
  const sec = document.getElementById('loc-section').value;
  const drawerEls = document.querySelectorAll('#drawerList input');
  const drawers = [];
  drawerEls.forEach(el => {
    const v = el.value.trim();
    if (v) drawers.push(v);
  });
  if (drawers.length === 0) { toast("Agrega al menos 1 sección"); return; }

  const targetArr = sec === "equipos" ? customEquiposLocs : customMaterialesLocs;

  if (editId) {
    // Edit existing
    const idx = targetArr.findIndex(l=>l.id===editId);
    if (idx === -1) return;
    const oldName = targetArr[idx].id;
    targetArr[idx].name = name;
    targetArr[idx].icon = icon;
    // Update drawers — keep existing drawer names that items reference
    const oldDrawers = targetArr[idx].drawers;
    targetArr[idx].drawers = drawers;
    // If id (name) changed, update items
    if (oldName !== name) {
      targetArr[idx].id = name;
      items.forEach(i => { if (i.location === oldName) i.location = name; });
    }
    // If drawer names changed, update items
    oldDrawers.forEach((od, di) => {
      if (drawers[di] && drawers[di] !== od) {
        items.forEach(i => { if (i.location === name && i.drawer === od) i.drawer = drawers[di]; });
      }
    });
  } else {
    // Check unique name
    const allLocs = getLocs();
    if (allLocs.some(l=>l.id===name)) { toast("Ya existe una ubicación con ese nombre"); return; }
    targetArr.push({ id: name, name: name, icon: icon, drawers: drawers });
  }

  saveData();
  closeModal();
  render();
  toast(editId ? "Ubicación actualizada" : "Ubicación creada");
}

function deleteLoc(locId) {
  if (!isCustomLoc(locId)) return;
  const locItems = items.filter(i => i.location === locId);
  const msg = locItems.length > 0
    ? `"${locId}" tiene ${locItems.length} ítem(s). ¿Eliminar la ubicación y todos sus ítems?`
    : `¿Eliminar la ubicación "${locId}"?`;
  showConfirm(msg, function() {
    // Remove items in this location
    items = items.filter(i => i.location !== locId);
    // Remove from custom arrays
    customMaterialesLocs = customMaterialesLocs.filter(l=>l.id!==locId);
    customEquiposLocs = customEquiposLocs.filter(l=>l.id!==locId);
    // Clean up locCodes
    delete locCodes[locId];
    // If currently viewing this location, go to dashboard
    if (currentLoc === locId) { currentLoc = null; currentDrawer = null; viewMode = "dashboard"; }
    saveData();
    render();
    toast("Ubicación eliminada");
  });
}

// Default editor password (used only on first run or if Firestore doc doesn't exist yet)
const DEFAULT_EDITOR_PASS = "labfisica2024";
let editorPassCache = null; // cache from Firestore to avoid re-fetching

// Load editor password from Firestore (or create default doc)
async function loadEditorPassword() {
  if (!firestoreReady || !db) return DEFAULT_EDITOR_PASS;
  try {
    const doc = await db.collection("config").doc("editor").get();
    if (doc.exists) {
      editorPassCache = doc.data().password;
      return editorPassCache;
    } else {
      // First time: create the config doc with default password
      await db.collection("config").doc("editor").set({ password: DEFAULT_EDITOR_PASS, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      editorPassCache = DEFAULT_EDITOR_PASS;
      return DEFAULT_EDITOR_PASS;
    }
  } catch(e) {
    console.warn("Could not load editor password from Firestore:", e);
    return editorPassCache || DEFAULT_EDITOR_PASS;
  }
}

function switchLoginTab(tab) {
  loginTabMode = tab;
  document.getElementById("ltEditor").classList.toggle("active", tab==="editor");
  document.getElementById("ltLector").classList.toggle("active", tab==="lector");
  document.getElementById("loginEditorFields").hidden = tab !== "editor";
  document.getElementById("loginLectorFields").hidden = tab !== "lector";
  document.getElementById("loginBtn").textContent = tab==="editor" ? "Ingresar como Editor" : "Ingresar como Lector";
  document.getElementById("loginBtn").onclick = tab==="editor" ? doLogin : doLoginLector;
  document.getElementById("loginHint").textContent = tab==="editor" ? "Acceso completo al inventario" : "Solo lectura — puede solicitar equipos";
  document.getElementById("loginError").textContent = "";
}

async function doLogin() {
  const input = document.getElementById("loginPass").value;
  if (!input) {
    document.getElementById("loginError").textContent = "Ingrese la contraseña";
    return;
  }
  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginBtn").textContent = "Verificando...";
  try {
    const correctPass = await loadEditorPassword();
    if (input === correctPass) {
      userRole = "editor";
      userName = "Editor";
      try { localStorage.setItem("inv_auth", "editor"); } catch(e) {}
      document.getElementById("loginOverlay").hidden = true;
      document.getElementById("appMain").hidden = false;
      document.getElementById("loginError").textContent = "";
      loadSolicitudes();
      render();
    } else {
      document.getElementById("loginError").textContent = "Contraseña incorrecta";
      document.getElementById("loginPass").value = "";
      document.getElementById("loginPass").focus();
    }
  } catch(e) {
    document.getElementById("loginError").textContent = "Error de conexión";
  }
  document.getElementById("loginBtn").disabled = false;
  document.getElementById("loginBtn").textContent = "Ingresar como Editor";
}

async function doLoginLector() {
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginUserPass").value;
  if (!user || !pass) {
    document.getElementById("loginError").textContent = "Ingrese usuario y contraseña";
    return;
  }
  if (!firestoreReady) {
    document.getElementById("loginError").textContent = "Sin conexión al servidor";
    return;
  }
  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginBtn").textContent = "Verificando...";
  try {
    const snap = await db.collection("usuarios").where("username","==",user.toLowerCase()).get();
    if (snap.empty) {
      document.getElementById("loginError").textContent = "Usuario no encontrado";
      document.getElementById("loginUser").focus();
    } else {
      const doc = snap.docs[0];
      const data = doc.data();
      if (data.password === pass) {
        userRole = "lector";
        userName = data.displayName || user;
        try {
          localStorage.setItem("inv_auth", "lector");
          localStorage.setItem("inv_auth_user", user.toLowerCase());
        } catch(e) {}
        document.getElementById("loginOverlay").hidden = true;
        document.getElementById("appMain").hidden = false;
        document.getElementById("loginError").textContent = "";
        loadSolicitudes();
        render();
      } else {
        document.getElementById("loginError").textContent = "Contraseña incorrecta";
        document.getElementById("loginUserPass").value = "";
        document.getElementById("loginUserPass").focus();
      }
    }
  } catch(e) {
    console.error("Login lector error:", e);
    document.getElementById("loginError").textContent = "Error de conexión";
  }
  document.getElementById("loginBtn").disabled = false;
  document.getElementById("loginBtn").textContent = "Ingresar como Lector";
}

function doLogout() {
  userRole = null;
  userName = null;
  try { localStorage.removeItem("inv_auth"); localStorage.removeItem("inv_auth_user"); } catch(e) {}
  document.getElementById("loginOverlay").hidden = false;
  document.getElementById("appMain").hidden = true;
  document.getElementById("loginPass").value = "";
  document.getElementById("loginUser") && (document.getElementById("loginUser").value = "");
  document.getElementById("loginUserPass") && (document.getElementById("loginUserPass").value = "");
  document.getElementById("loginError").textContent = "";
  switchLoginTab("editor");
}
